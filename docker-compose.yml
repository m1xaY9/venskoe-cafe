services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: venskoe
      POSTGRES_PASSWORD: venskoe
      POSTGRES_DB: venskoe
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venskoe -d venskoe"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
