                        The parameter is transmitted only when using FDF version 1.2 and can have a numerical value only:
                          * 0 - For commodities sold singly or in units.
                          * 10 - Gramm
                          * 11 - Kilogram
                          * 12 - Ton
                          * 20 - Centimetre
                          * 21 - Decimeter
                          * 22 - Meter
                          * 30 - Square centimetre
                          * 31 - Square decimeter
                          * 32 - Square meter
