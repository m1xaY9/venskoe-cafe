                maxLength: 255
                minLength: 1
                pattern: ^[ -~А-Яа-яЁёA-Za-z0-9-_]*$
                example: KKT074140          
              fiscalizationDate:
                description: Дата активации (фискализации) ФН с указанием таймзоны
                x-description-i18n:
                  eng: Activation date with timezone
                type: string
                maxLength: 255
                minLength: 1
                pattern: ^[A-Za-z0-9-_.-]+$
                example: 2025-11-10T08:33:00+00:00           
              fiscalStorageExpiration:
                description: Дата замены ФН (Срок действия ФН), с указанием таймзоны
                x-description-i18n:
                  eng: Fiscal drive change date with timezone
                type: string
                maxLength: 255
                minLength: 1
                pattern: ^[A-Za-z0-9-_.-]+$
                example: 2027-02-22T21:00:00+00:00          
              signedDocuments:
                description: Количество подписанных документов в ФН. Максимальный объем ФН около 250000 документов
                x-description-i18n:
                  eng: Number of signed documents in the fiscal drive. Maximum volume is about 250000 documents
                type: integer
                maxLength: 10
                minLength: 1
                example: 91742
              fiscalStoragePercentageUse:
                description: Наполненность ФН в %. Рекомендуем инициировать замену ФН при достижении 90%.
                x-description-i18n:
                  eng: Fiscal drive fullness percentage. We recommendthat you initiate a replacement when you reach 90%
                type: number
                maxLength: 6
                example: 36 
              fiscalStorageINN:
                description: ИНН компании (указанный в ФН)
                x-description-i18n:
                  eng: Company INN in the fiscal drive
                type: string
                maxLength: 12
                minLength: 1
                pattern: ^[0-9-]+$
                example: 1234567890
              fiscalStorageSerialNumber:
                description: Заводской (серийный) номер ФН
                x-description-i18n:
                  eng: Fiscal drive serial number
                type: string
                maxLength: 16
                minLength: 1
                pattern: ^[0-9-]+$
                example: 9999078902014017             
              fiscalStoragePaymentAddress:
                description: Адрес расчёта, указанный в ФН
                x-description-i18n:
                  eng: Fiscal drive billing address
                type: string
                maxLength: 256
                minLength: 1
                pattern: ^[ -~А-Яа-яЁёA-Za-z0-9-_]*$
                example: test.ffdv4.ru    
              groupCode:
                description: Код группы касс
                x-description-i18n:
                  eng: Group code
                type: string
                maxLength: 300
                minLength: 1
                pattern: ^[ -~А-Яа-яЁёA-Za-z0-9-_]*$
                example: group_code_4620 
              timestamp:
                description: Время и дата формирования данных в кассовом сервисе, UTC
                x-description-i18n:
                  eng: Date and time jf generationg data in the cash deck service, UTC
                type: string
                maxLength: 255
                minLength: 1
                pattern: ^[A-Za-z0-9-_]*$
                example: 2026-08-10T06:54:10+00:00  
              isShiftOpened:
                description: Признак открыта смена или закрыта. true - открыта, false – закрыта. Нормальное состояние смены – открыта. Автоматическое   переоткрытие смены происходит раз в сутки.
                x-description-i18n:
                  eng: The characteristic is open or closed. True - open, false - closed. The normal state of the shift is open. Automatic re-opening of the  shift occurs once a day.
                type: boolean
                example: true
              shiftNumber:
                description: Номер смены (или "Номер закрытой смены", когда смена закрыта)
                x-description-i18n:
                  eng: Shift number (or Closed shift number if closed)
                type: integer
                maxLength: 7
                minLength: 1
                example: 277
              shiftReceipt:
                description: Номер документа за смену (или "Кол-во чеков закрытой смены", когда смена закрыта). Нормальное количество чеков за смену, без попадания чеков в timeout, от 6 до 10 тысяч. 
                x-description-i18n:
                  eng: Document number per shift (or "Number of closed shift checks" when the shift is closed). Normal number of checks per shift, without getting checks into timeout, from 6 to 10 thousand.
                type: integer
                maxLength: 10
                minLength: 1
                example: 60 
              unsentDocs:
                description: |
                  Количество неотправленных документов.
                  Указывается, если значение отлично от 0. Некоторое единовременное количество неотправленных чеков допустимо, в пределах 10-15. Если накоплено большее кол-во неотправленных чеков, рекомендуем проверить статус касс в ОФД: активна ли подписка, присутствуют ли кассы в ОФД.  
                x-description-i18n:
                  eng: |
                    Number of unsent documents.
                    Specified if the value is not 0. A certain one-time number of unsent checks is permissible, in the range of 10-15. If you have accumulated more unsent checks, we recommend that you check the status of the cash desks in the OFD: is the subscription active, are the cash desks present in the OFD
                type: integer
                maxLength: 10
                minLength: 1
                example: 1
              firstUnsentDocTimestamp:
                description: Дата первого неотправленного документа. Указывается, если есть неотправленные документы
                x-description-i18n:
                  eng: Date of first unsent document. Specified if there are unsent documents
                type: string
                maxLength: 255
                minLength: 1
                pattern: ^[A-Za-z0-9-_]*$
                example: 2026-08-10T06:54:00+00:00 
              networkErrorCode:
                description: |
                  Код ошибки сети:                
                    0 - Нет ошибок                
                    1 - Отсутствует физический канал связи                
                    2 - Ошибка сетевых настроек или нет соединения с сервером ОФД                
                    3 - Разрыв соединения при передаче документа на сервер                
                    4 - Некорректный заголовок сессионного пакета                
                    5 - Превышен таймаут ожидания квитанции                
                    6 - Разрыв соединения при приеме квитанции                
                    7 - Превышен таймаут передачи документа на сервер                
                    8 - ОФД-процесс не иницилизирован
                x-description-i18n:
                  eng: |
                    Network error code:
                      0 - No errors                
                      1 - No physical communication channel                
                      2 - Network configuration error or no connection to the OFD server                
                      3 - Disconnection when transferring a document to the server                
                      4 - Incorrect session packet header                
                      5 - Bill timeout exceeded                
                      6 - Connection break when receiving a receipt                
                      7 - Document upload timed out                
                      8 - OFD process is not initiated
                type: integer
                maxLength: 2
                minLength: 1
                example: 0  
        total:
          description: Общее количество касс в группе касс
          x-description-i18n:
            eng: Total number of cash desks in the cash desk group
          type: integer
          maxLength: 4
