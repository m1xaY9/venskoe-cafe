    paymentTokenDecrypted:
      description: |
        Закодированный в base64url JSON-объект с платёжными данными полученными и расшифрованными на стороне Партнера из JWT Payload (Claim) от MirPay. Состав JSON-объекта:
          Объект  |Тип     |Обязательно|Описание
          --------|--------|-----------|-------------------------------------
          tan     |string  |да         |Номер Токена (TAN)
          cav     |string  |да/нет     |Authentication Value (NSPK-InApp криптограмма). Может отсутствовать для операций по сохраненным реквизитам
          tey     |integer |да         |Последние две цифры года срока окончания действия токена. Возможные значения: 18-99
          tem     |integer |да         |Порядковый номер месяца в году срока окончания действия токена. Возможные значения: 1-12
          transId |string  |да/нет     |Уникальный идентификатор In-App операции в формате UUID. Может отсутствовать для операций по сохраненным реквизитам
          mId     |string  |да/нет     |Идентификатор ТСП (Merchant ID).Может отсутствовать для операций по сохраненным реквизитам
          mx5c    |string  |да/нет     |Cертификат X.509 в Base64 открытого ключа ТСП. Может отсутствовать для операций по сохраненным реквизитам
          orderId |string  |да/нет     |Уникальный идентификатор заказа/транзакции на стороне ТСП. Может отсутствовать для операций по сохраненным реквизитам
          sum     |integer |да/нет     |Сумма платежа в минимальных единицах валюты. Должна совпадать с суммой заказа. Может отсутствовать для операций по сохраненным реквизитам
          cur     |integer |да/нет     |Цифровой код валюты по ISO 4217. Может отсутствовать для операций по сохраненным реквизитам
          media   |string  |да/нет     |Тип источника, через который инициирована In-App операция. `ISDK` = In-Application SDK, `DL` = Deep link, `UL` = Universal link, `TR` = In-Application Mir HCE SDK
      x-description-i18n:
        eng: |
          JSON object encoded in base64url with payment data received and decrypted on the Merchant's side from MirPay JWT Payload (Claim). JSON composition:
          
          Object    |Type    |Required   |Description
          ----------|--------|-----------|-------------------------------------
          tan       |string  |yes        |Token number (TAN)
          cav       |string  |yes/no     |Authentication Value (NPCK-InApp cryptogram). May not be available for transactions with stored details
          tey       |integer |yes        |Last two digits of the token expiration year. Possible values: 18-99
          tem       |integer |yes        |Month sequence number of the token expiration year. Possible values: 1-12
          transId   |string  |yes/no     |Unique In-App transaction identifier in UUID format. May not be available for transactions with stored details
          mId       |string  |yes/no     |Merchant ID. May not be present for transactions with stored details
          mx5c      |string  |yes/no     |X.509 certificate in Base64 of the merchant public key. May not be available for transactions with stored details
          orderId   |string  |yes/no     |Unique order/transaction identifier on the merchant side. May not be available for transactions wit hstored details.
          sum       |integer |yes/no     |Payment amount minor units of currency. It must be equal to the order amount. May not be available for transactions with stored details
          cur       |integer |yes/no     |Digital currency code acc. to ISO 4217 ISO 4217. May not be available for transactions with stored details
          media     |string  |yes/no     |Source type used to initiate the In-App transaction. `ISDK` = In-Application SDK, `DL` = Deep link, `UL` = Universal link, `TR` = In-Application Mir HCE SDK
      type: string
      format: base64url
      maxLength: 8192
      minLength: 1
      pattern: ^[ -~]*$
      example: 

    paymentWay:
      description: |
        Способ совершения платежа. Возможны следующие варианты:
          * `CARD` - Оплата с вводом карточных данных;	
          * `CARD_BINDING` - Оплата связкой (сохраненной на платежном шлюзе картой);	
          * `SBRF_SBOL` - оплата через Сбербанк Онлайн (SberPay);
          * `SBOL_BINDING` - оплата связкой Сбербанк Онлайн (SberPay);  
          * `SBERID_CARD_BINDING` - Оплата связкой через sberwallet картой или другим способом;
          * `SBERID_SBOL_BINDING` - Оплата связкой через sberwallet через сперпей;     
          * `SBERPAY_SDK_SBOL` - Оплата через SDK через SberPay;
          * `ECOM_SDK_CARD` - Оплата SDK ECOMM по карте;
          * `ECOM_SDK_BINDING` - Оплата SDK ECOMM по сохраненной карте;
          * `SBERPAY_SBP_C2B_DYN` - "Оплата С2B СБП" / "Оплата с привязкой счета C2B СБП" по Одноразовой Платежной ссылке СБП (QR-Dynamic);
          * `SBERPAY_SBP_C2B_DYN_SUBS` - Оплата с привязанного счета C2B СБП (Подписка СБП);
          * `IPOS` - Оплата с использованием POS Кредита;
          * 'NSPK_DIGITAL_RUB' - Оплата с использованием Цифрового Рубля;
          * `P2P_CREDIT` - Выплата.
      x-description-i18n:
        eng: | 
          Payment method. The following options are available:
          * `CARD` - Payment with card data entry;
          * `CARD_BINDING` - Payment by card binding (with a card saved on the payment gateway);
          * `SBRF_SBOL` - Payment by Sberbank online (SberPay);
          * `SBOL_BINDING` - Payment by Sberbank online binding (SberPay binding);
          * `SBERPAY_SDK_SBOL` - Payment by Sberbank card from SDK;
          * `ECOM_SDK_CARD` - Payment from SDK ECOMM by card;
          * `ECOM_SDK_BINDING` - Payment from SDK ECOMM by card binding (with a card saved on the payment gateway);
          * `SDK_SBOL_BINDING` - Payment by Sberbank online binding (SberPay binding) from SDK;
          * `SBERPAY_SBP_C2B_DYN` - Payment by SBP (QR-Dynamic);
          * `SBERPAY_SBP_C2B_DYN_SUBS` - Payment by SBP subscription;
          * `IPOS` - Payment by POS-credit;
          * 'NSPK_DIGITAL_RUB' - Digital Rouble payment.
      type: string
      maxLength: 64
      minLength: 1
      pattern: ^[ -~]*$
      example: CARD

