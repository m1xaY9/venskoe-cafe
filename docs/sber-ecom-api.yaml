    orderBundle:
      description: Блок, необходимый для формирования фискальных чеков. Содержит данные фискализации и корзину заказа. Также обязателен при регистрации заказов POS-кредитования
      x-description-i18n:
        eng: The block needed to generate fiscal receipts. It contains fiscalization data and order cart. Mandatory if POS lending order registration queries are sent.
      type: object
      required:
        - cartItems
      properties:
        orderCreationDate:
          description: Дата создания заказа
          x-description-i18n:
            eng: Order creation date
          type: string
          format: YYYY-MM-DDTHH:mm:ss
          example: 2027-12-31T23:59:59

        installments:
          description: Блок, в котором указаны параметры типа и срока интернет-кредитования. <span style="color:blue;">Обязателен в случае отправки запросов POS-кредитования.</span>
          x-description-i18n:
            eng: Block with the Internet lending type and term parameters. <span style="color:blue;">Mandatory if POS lending queries are sent.</span>
          type: object
          properties:
            productType:
              description: |
                Признак покупки в кредит. <span style="color:red;">Обязателен в случае отправки запросов POS-кредитования.</span> Возможны следующие значения:
                  * `CREDIT` = кредит;
                  * `INSTALLMENT` = рассрочка.
              x-description-i18n:
                eng: |
                  Credit purchase attribute. <span style="color:red;">Mandatory if POS lending queries are sent.</span> The following values are possible:
                    * `CREDIT` = loan;
                    * `INSTALLMENT` = installment.
              maxLength: 11
              minLength: 1
              enum:
                - CREDIT
                - INSTALLMENT
              type: string
              example: INSTALLMENT
            productID:
              description: Реквизит для старой совместимости
              x-description-i18n:
                eng: Detail for old compatibility
              type: string
              maxLength: 12
              minLength: 1
            rightTerms:
              description: |
                Желаемый срок кредитования в месяцах. Возможна передача нескольких значений через запятую. <span style="color:red;">Атрибут обязательно передается, если выбран productType=INSTALLMENT.</span>
                  * Если параметр заполнен, то клиенту будут доступны только указанные в параметре сроки оплаты. Например, если "rightTerms":[3,6,9], то клиенту будут доступны для выбора сроки 3, 6 или 9 месяцев.
                  * Если параметр не заполнен, то клиенту будут доступны все ранее утвержденные с банком сроки.
              x-description-i18n:
                eng: |
                  Desired loan term in months. Multiple values can be passed separated by commas. <span style="color:red;">The attribute is mandatory passed if productType=INSTALLMENT is selected.</span>
                    * If the parameter is filled in, then only the payment terms specified in the parameter will be available to the Merchant. For example, if it is "rightTerms":[3,6,9], then the Merchant will have the choice of 3, 6 or 9 months.
                    * If the parameter is not filled in, then all the terms previously approved by the bank will be available to the Merchant.
              type: array
              items:
                type: integer
              example: [3, 6, 9]
          example: {}
        ffdVersion:
          description: | 
            Версия ФФД кассы (уточняется у Вашего кассового сервиса). <span style="color:red;">Параметр обязателен при необходимости формирования фискального чека.</span> Может принимать значения: 
              * `1.2` = Версия ФФД 1.2; 
              * `1.05` = Версия ФФД 1.05 (1.1 для Ferma от OFD.RU).
          x-description-i18n:
            eng: | 
              The version of the cashier’s desk FDF (to be specified by your cash service). <span style="color:red;">The parameter is mandatory when it is necessary to generate a fiscal receipt. </span> It can take the following values:
                * `1.2` = FDF version 1.2; 
                * `1.05` = FDF version 1.05 (1.1 for Ferma from OFD.RU).
          enum:
            - 1.05
            - 1.2
          type: string
          example: "1.2"

        receiptType:
          description: |
            Тип формируемого чека. <span style="color:red;">Параметр обязателен при необходимости формирования фискального чека.</span> Может принимать следующие значения:
              * `SELL` = Чек "Приход". Данный чек формируется в том числе при проведении частичного полного расчета.
              * `SELL_REFUND` = Чек "Возврат прихода".
              * `SELL_CORRECTION` = Чек "Коррекция прихода" (используется только в сервисе doCorrection)
              * `SELL_REFUND_CORRECTION` = Чек "Коррекция возврата прихода" (используется только в сервисе doCorrection)
          x-description-i18n:
            eng: |
              Type of the receipt to be generated. <span style="color:red;">The parameter is mandatory when it is necessary to generate a fiscal receipt. </span> It can take the following values:
                * `SELL` = "Receipt" receipt. This receipt is also generated at the time of partial full settlement.
                * `SELL_REFUND` = "Refund of receipt" receipt.
                * `SELL_CORRECTION` = "Receipt correction" receipt (only for doCorrection service)
                * `SELL_REFUND_CORRECTION` = "Refund of receipt correction" receipt (only for doCorrection service)                
          enum:
            - SELL
            - SELL_REFUND
          type: string
          example: "SELL"
        ismOptional:
          description: |
            Параметр указывает необходимость регистрации чека, в случае недоступности системы маркировки (ИСМ). Используется только для ФФД 1.2 при продаже маркированного товара и касс АТОЛ Онлайн. Может принимать значения:
              * `true` - Чек будет зарегистрирован даже в случае, если "Честный знак" не ответил за установленное время. В результате проверки сведений о товаре укажется значение "0"
              * `false` (значение по умолчанию) - Чек не будет зарегистрирован при недоступности "Честный знак". Вернется ошибка 421 (Истек таймаут проверки КМ)
          x-description-i18n:
            eng: |
              The parameter indicates the need to register the receipt, in case the marking system (IMS) is not available. It is used only for FDF 1.2 when selling marked goods and ATOL Online cash registers. It can be:
                * `true` - The receipt will be registered even if the Honest Sign does not respond within the specified time. "0" will be specified as a result of the product data check.
                * `false` (default value) - The receipt will not be registered if the Honest Sign is unavailable. Error 421 will be returned (the CM verification timeout has expired).
          type: boolean
          example: true

        company:
          description: Информация о компании. __Обязателен при использовании фискализации.__
          x-description-i18n:
            eng: Company information. Mandatory when fiscalization is used.
          type: object
          required: 
          - email
          - sno
          - inn
          - paymentAddress
          properties:
            email:
              description: __Тег ФФД 1117.__ Адрес электронной почты компании. Отражается в чеке, который получит покупатель
              x-description-i18n:
                eng: __Tag FDF 1117.__ Company email. Displayed in the receipt the buyer will receive.
              type: string
              maxLength: 64
              minLength: 3
              pattern: ^[ -~]+$
              example: email@company.ru
            sno:
              description: |
                __Тег ФФД 1055.__ Система налогообложения. Может принимать следующие значения:
                  * `osn` - Общая система налогообложения
