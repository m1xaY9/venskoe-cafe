        bundleDetails:
          description: |
            Массив с атрибутами дополнительного описания Корзины. Для передачи атрибутов позиции в сторону процессинга лояльности СберСпасибо перед названием атрибута необходимо добавить префикс "spasibo_". Заполняется name-value.
                   
            Зарезервированные названия атрибутов
                      
            name     | value
            ---------|---------------------
            timezone | __Тег ФФД 1011__. Номер часовой зоны места (адреса) осуществления расчетов в соответствии с законодательством Российской Федерации. Число от 1 до 11.
            internet | __Тег ФФД 1125.__ Признак применения ККТ при осуществлении расчета в безналичном порядке в сети "Интернет" (true/false). По умолчанию используется значение true. 
            use_tspiot|__Только для АТОЛ Онлайн__. __true__: чек направляется на кассу с ТС ПИоТ. Если такой кассы нет, чек не фискализируется; возвращается ошибка TSPIOTRequired. __false__ или параметр отсутствует: чек направляется на кассу без ТС ПИоТ. Если такой кассы нет, чек может быть фискализирован на кассе с ТС ПИоТ без проверки КМ по разрешительному режиму.
            permissive_mode|__Только для АТОЛ Онлайн__. __true__: перед фискализацией выполняется проверка всех КМ в чеке. __false__ или параметр отсутствует:  проверка КМ по разрешительному режиму при фискализации не выполняется. 
