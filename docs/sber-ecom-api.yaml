    receiptStatus:
      description: |
        Статус чека
        * `0` - не определен;
        * `1` - ожидается отправка или переотправка чека
        * `2` - чек отправлен, ожидание результата обработки
        * `3` - чек обработан успешно
        * `4` - ошибка обработки чека
        * `5` - ошибка отправки чека (исчерпаны попытки отправки)
        * `6` - некорректные данные для отправки чека
      x-description-i18n:
        eng: |
          Receipt status
          * `0` - not defined;
          * `1` - receipt is expected to be sent or re-sent
          * `2` - receipt has been sent, waiting for the result of processing
          * `3` - receipt has been successfully processed
          * `4` - receipt processing error
          * `5` - receipt sending error (sending attempts exceeded)
          * `6` - incorrect data for sending the receipt
      type: integer
      minimum: 0
      maximum: 6
      example: 3

