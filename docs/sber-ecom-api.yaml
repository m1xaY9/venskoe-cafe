    threeDSMethodNotificationUrl:
      description: URL адрес Партнера для получения уведомления о завершении вызова 3DS Method (3DS Method Notification URL)
      x-description-i18n:
        eng: URL address of the Merchant for receiving the notification about the completion of a 3DS Method call (3DS Method Notification URL)
      type: string
      maxLength: 2048
      minLength: 1
      pattern: ^https?:\/\/(.*)$
      example: https://testmerchant.ru/3DSMethod

    threeDSMethodUrl:
      description: URL адрес для отправки запроса 3DS Method Data, если карта поддерживает вызов 3DS Method
      x-description-i18n:
        eng: URL address for sending the 3DS Method Data query, if the card supports the call of 3DS Method
      type: string
      maxLength: 2048
      minLength: 1
      pattern: ^[ -~]*$
      example: https://ds.vendorcert.mirconnect.ru/ma

    threeDSServerTransId:
      description: Идентификатор 3DS Server Transaction ID
      x-description-i18n:
        eng: 3DS Server Transaction ID
      type: string
      maxLength: 36
      minLength: 1
      pattern: ^[ -~]*$
      example: 93045e61-d783-40f1-8934-33fd59387ca6

    total:
      description: Итоговая сумма документа в рублях
      x-description-i18n:
        eng: Total amount of the fiscal document in major units of currency
      type: number

    transactionAttributes:
      description: Дополнительные параметры деталей заказа. Элемент присутствует в ответе, если при формировании ответа на создание заказа содержатся дополнительные параметры блока jsonParams которые могут использоваться в различных сценариях, каждый возвращаемый параметр представлен в отдельном блоке transactionAttributes
      x-description-i18n:
        eng: Additional parameters of order details The element is present in the response if the order creation response contains additional jsonParams parameters that can be used in different scenarios; each returned parameter is represented in a separate transactionAttributes block
      type: array
      items:
        type: object
        properties:
          name:
            description: Имя передаваемого параметра для различных свойств заказа
            x-description-i18n:
              eng: Name of the transmitted parameter for various order properties
            type: string
            maxLength: 20
            minLength: 1
            pattern: ^[A-Za-z0-9]*$
            example: merchantIp
          value:
            description: Значение передаваемого параметра для различных свойств заказа
            x-description-i18n:
              eng: Value of the transmitted parameter for various order properties
            type: string
            maxLength: 1024
            minLength: 1
            pattern: ^[A-Za-z0-9]*$
            example: 194.54.15.41
        additionalProperties: false

    unBindCardRequest:
      type: object
      required:
