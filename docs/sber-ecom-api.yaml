    # Фискализация (54-ФЗ)
    
    В соответствии с Федеральным законом РФ №54-ФЗ c 01.07.2017 при осуществлении онлайн продаж, Продавец (в данной документации - Клиент), с помощью онлайн-кассы, обязан формировать кассовый чек и направлять его в ФНС и покупателю. В целях исполнения данного требования ПАО Сбербанк разработан механизм интеграции с онлайн-кассами, позволяющий упростить для Партнера данную процедуру. На текущий момент Платежным шлюзом поддерживаются только кассы "АТОЛ Онлайн", “Цифровая касса ЭВОТОР”, "Бизнес.ру" с версиями ФФД 1.05 и 1.2, а так же "OFD.RU" с версиями ФФД 1.1 и 1.2.
    
    ## Доступный функционал
    - Отправка данных онлайн-кассе для формирования чеков в форматах ФФД 1.05 и 1.2;
    - Формирование чеков прихода, возврата прихода (в том числе - частичного); 
    - Возможность переотправки неуспешного чека с изменением корзины;
    - Переотправка чека в случае возникновения ошибки кассы или при таймауте отправки;
    - Создание чека отдельно от финансовой операции (закрывающий чек);
    - Возможность разделения чека на несколько, в случае превышения максимального размера;
    - Получение статуса чека отдельным API запросом.
    
    ## Условия формирования чеков
    Для успешной регистрации кассового чека необходимо выполнение следующих условий:
      - Для создания чека необходимо передать корзину с обязательным присутствием параметров ffdVersion и receiptType в любом из сервисов register, registerPreAuth, deposit, reverse, refund;
      - В каждом чеке будут присутствовать параметры, которые были переданы в составе соответствующего сервиса;
      - Функционал фискализации заказов подключен и успешно настроен для мерчанта: учетные данные для подключения онлайн-кассы корректны и внесены в настройки. 

    ## Разрешительный режим продажи маркированных товаров
    
    Перед продажей маркированного товара необходимо проверить код маркировки (КМ) в рамках разрешительного режима. До 30.09.2026 включительно для онлайн-проверки может использоваться токен X-API-Key. С 01.10.2026 X-API-Key становится недоступен, поэтому проверку КМ необходимо выполнять через ТС ПИоТ. Шлюз Банка предоставляет сервис getMarkStatus для проверки КМ через ТС ПИоТ при работе с сервисами фискализации Цифровая касса Эвотор, АТОЛ Онлайн и Бизнес.Ру Онлайн-чеки.

    Для работы с ТС ПИоТ необходимо:
    
    1. Использовать кассу и формировать чеки по ФФД 1.2. На кассе должна быть включена работа с маркированными товарами и, при необходимости, с подакцизными товарами.
    2. Зарегистрироваться в системе “Честный знак” и выполнить необходимые действия для подключения..
    3. Приобрести лицензию на ТС ПИоТ.
    4. Обратиться к кассовому провайдеру для подключения и настройки ТС ПИоТ.
    
    При возникновении вопросов по подключению ТС ПИоТ необходимо обращаться в поддержку кассового сервиса.

    Существует 2 способа проверки КМ через ТС ПИоТ:
    
    1.	Автоматическая проверка КМ. Проверку выполняет кассовый сервис и передаёт данные в систему “Честный знак”. Проверка выполняется, если тип регистрируемого чека — SELL, в позиции передан КМ и не передан sectoralItemProps (тег 1260) с вложенными объектами. При положительном результате кассовый сервис заполняет отраслевые реквизиты и направляет чек на фискализацию; при отрицательном результате чек не формируется. 
    2.	Предварительная проверка КМ через сервис getMarkStatus. Сервис позволяет получить статус кода маркировки и включить данные проверки в sectoralItemProps (тег 1260) при формировании “закрывающего” чека.
    Для избежания случаев невозможности сформировать чек из-за отрицательного результата проверки КМ после выдачи товара или сборки, рекомендуем пользоваться сервисом getMarkStatus и проверять статус КМ самостоятельно заранее.
    
    Особенности работы с АТОЛ Онлайн
    
      *	При торговле маркированными товарами в orderBundle.bundleDetails необходимо всегда передавать параметр use_tspiot со значением true. Параметр указывает сервису на необходимость направить чек на кассу с ТС ПИоТ.
      *	Для автоматической проверки статуса КМ кассой и заполнения отраслевых реквизитов sectoralItemProps (тег 1260) в orderBundle.bundleDetails необходимо передавать параметр permissive_mode со значением true.
      *	Пример параметров для проверки КМ сервисом АТОЛ Онлайн при фискализации:
      
      “bundleDetails”: [
      { “name”: “use_tspiot”, “value”: “true” },
      { “name”: “permissive_mode”, “value”: “true” }]
      
    Состав тега 1260:
    | Тег |     Наименование         |       Значение            |
    |-----|--------------------------|---------------------------|
    |1262 | Идентификатор ФОИВ       | фиксированное: 030        |
    |1263 | Дата документа основания | фиксированное: 21.11.2023 |
    |1264 | Номер документа основания| фиксированное: 1944       |
    |1265 | Значение отраслевого реквизита | динамическое поле. В ответе метода проверки КМ в ЧЗ в режиме онлайн возвращаются атрибуты __reqId__ (Идентификатор запроса) и __reqTimestamp__ (Время запроса). Атрибуты необходимо передавать в тег 1265 в формате: _UUID=reqId&Time=reqTimestamp_ | 
   
    __Лекарственные средства__. Для маркированных лекарственных препаратов необходимо предварительно выполнить проверку через getMarkStatus. В sectoralItemProps передаются:

    1262 = 020, 1263 = 14.12.2018, 1264 = 1556; 
    значение 1265 формируется в виде UUID=<reqId>&Time=<reqTimestamp>&tm=mdlp&ps=<серия рецепта>&dn=<номер рецепта>&dd=<дата рецепта>&sid=<идентификатор МДЛП>.   

    ## Подключение кассы
    Для подключения кассы Эвотор необходимо:
    1. Зарегистрироваться в сервисе [Цифровая касса](https://digital.evotor.ru/login) для получения облачной кассы или установить приложение [Цифровая касса из магазина Эвотор](https://market.evotor.ru/store/apps/2778de62-57ee-4324-8f17-d89f17c91872) вашей онлайн-кассы.
    2. Самостоятельно, в соответствии с [инструкцией](https://docs.evotor.online/) или с помощью сотрудников Эвотор зарегистрируйте кассу в Федеральной Налоговой Службе (ФНС) и у Оператора Фискальных Данных (ОФД).
    3. В личном кабинете [Цифровой кассы](https://digital.evotor.ru/login) (если используете облачную кассу) или в личном кабинете Эвотор (если используете онлайн-кассу) получите учетные данные кассы – Код группы касс.
    4. Настроить интеграцию можно через личный кабинет [СберБизнес](https://www.sberbank.com/help/business/sbbol/100746) или направив запрос в службу технической поддержки интернет-эквайринга Сбербанка. В запросе следует указать Код группы касс, используемую версию ФФД и merchantID, предоставленный Банком.
    
    Для подключения кассы АТОЛ необходимо:
    1. Зарегистрироваться в сервисе ["АТОЛ Онлайн"](https://sberbank.atol.ru/);
    2. Самостоятельно, в соответствии с [инструкцией](https://atol.online/upload/iblock/83b/0s367ftz1ydlc8cf1v55vljqt3cr16t2/Atol_Pamyatka_APRIL_22.pdf) или с помощью сотрудников АТОЛ Онлайн зарегистрируйте кассу в Федеральной Налоговой Службе (ФНС) и у Оператора Фискальных Данных (ОФД);
    3. В личном кабинете АТОЛ Онлайн получите учетные данные кассы (логин, пароль, код группы ККТ);
    4. Настроить интеграцию можно через личный кабинет [СберБизнес](https://www.sberbank.com/help/business/sbbol/100746) или направив запрос в службу технической поддержки интернет-эквайринга Сбербанка. В запросе следует указать учетные данные кассы и используемую версию ФФД.
    
    Для подключения кассы OFD.RU необходимо:
    1. Зарегистрироваться в личном кабинете [Партнера OFD.RU](https://lk.ofd.ru/);
    2. Зарегистрируйте кассу в Федеральной Налоговой Службе (ФНС);
    3. В личном кабинете Партнер OFD.RU получите учетные данные кассы (логин и пароль);
    4. Настроить интеграцию можно через личный кабинет [СберБизнес](https://www.sberbank.com/help/business/sbbol/100746) или направив запрос в службу технической поддержки интернет-эквайринга Сбербанка. В запросе следует указать учетные данные кассы и используемую версию ФФД.
    
    Для подключения кассы Бизнес.Ру необходимо:
    1. Зарегистрироваться в личном кабинете [Бизнес.Ру](https://check.business.ru/);
    2. Зарегистрируйте кассу в Федеральной Налоговой Службе (ФНС);
    3. Обратиться в поддержку Бизнес.Ру с запросом подключения интеграции Сбербанка api-sberbank;
    4. В личном кабинете Бизнес.Ру получите учетные данные кассы (логин и пароль);
    4. Настроить интеграцию можно через личный кабинет [СберБизнес](https://www.sberbank.com/help/business/sbbol/100746) или направив запрос в службу технической поддержки интернет-эквайринга Сбербанка. В запросе следует указать учетные данные кассы и используемую версию ФФД.
 
