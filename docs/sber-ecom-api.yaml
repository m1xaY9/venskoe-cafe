                            Значение результата проверки сведений о коде маркировки в данной позиции в Честном Знаке. Проверка пройдена при значении “15”
                            
                            result | Статус КМ | Значение тега 2106 по ФФД 1.2 | Описание результата проверки КМ                                                                                                  | В каком случае получается
                            -------|-----------|-------------------------------|----------------------------------------------------------------------------------------------------------------------------------|------------------------------------------
                            0      | M         |0                              | Проверка КП КМ не выполнена, статус товара оператором информационных систем маркировки (далее – ОИСМ) не проверен                | Если передан ismOptional и Честный Знак недоступен 
                            16     | M         |10000                          | Проверка КП КМ не выполнена, статус товара ОИСМ не проверен (ККТ функционирует в автономном режиме)                              | Вероятно, касса зарегистрирована в автономном режиме. 
                            19     | M         |10011                          | Проверка КП КМ выполнена в ФН с положительным результатом, статус товара ОИСМ не проверен (ККТ функционирует в автономном режиме)| Вероятно, касса зарегистрирована в автономном режиме. 
                            17     | M-        |10001                          | Проверка КП КМ выполнена в ФН с отрицательным результатом, статус товара ОИСМ не проверен (ККТ функционирует в автономном режиме)| Вероятно, касса зарегистрирована в автономном режиме. 
                            5      | M-        |101                            | Проверка КП КМ выполнена с отрицательным результатом, статус товара у ОИСМ некорректен                                           | В ФН код проверки КМ оказался некорректным и затем в Честном Знаке КМ тоже оказался некорректным.
                            7      | M-        |111                            | Проверка КП КМ выполнена с положительным результатом, статус товара у ОИСМ некорректен                                           | В ФН код проверки КМ оказался корректным, а в Честном Знаке КМ оказался некорректным.
                            15     | M+        |1111                           | Проверка КП КМ выполнена с положительным результатом, статус товара у ОИСМ корректен                                             | Все проверки КМ прошли успешно                        
                          x-description-i18n:
                            eng: |
                              Value of verification result of the marking code information in this position in the Honest Sign. Verification is passed if the value is "15”
                              
                              result | MC status | Tag value 2106 according to FDF 1.2 | Description of the MC verification result                                                                                                                                         | In which case the following results can be obtained
                              -------|-----------|-------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------
                              0      | M         | 0                                   | The MC verification code check has failed, the commodity status has not been checked by the informational marking system operator (hereinafter - IMSO)                            | If ismOptional is transmitted and the Honor Sign is not available 
                              16     | M         |10000                                | The MC verification code check, the commodity status has not been checked by the IMSO (Cash register runs in off-line mode)                                                       | The cash register is probably registered in off-line mode. 
                              19     | M         |10011                                | The MC verification code check has been performed in the FMS with a positive result, the commodity status has not been checked by the IMSO (Cash register runs in off-line mode)  | The cash register is probably registered in off-line mode. 
                              17     | M-        |10001                                | The MC verification code check has been performed in the FMS with a negative result, the commodity status has not been checked by the IMSO (Cash register runs in off-line mode)  | The cash register is probably registered in off-line mode. 
                              5      | M-        |101                                  | The MC verification code check has been performed with a negative result, the commodity status checked by the IMSO is incorrect                                                   | The MC verification code has occurred to be incorrect in the FMS and incorrect in the Honest Sign as well.
                              7      | M-        |111                                  | The MC verification code check has been performed with a positive result, the commodity status checked by the IMSO is incorrect                                                   | The MC verification code has occurred to be correct in the FMS and incorrect in the Honor Sign.
                              15     | M+        |1111                                 | The MC verification code check has been performed with a positive result, the commodity status checked by the IMSO is correct                                                     | All the MC checks have been passed successfully                        
                          type: string
                          pattern: ^\d+$
                          minLength: 0
                          maxLength: 19
