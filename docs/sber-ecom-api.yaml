          x-description-i18n:
            eng: __FDF 1244 tag.__ Code of the country which the Merchant is a citizen of. To be specified according to the All-Russian Classifier of World Countries (OKSM). Used only if the Merchant is a foreign citizen. Only for FDF 1.2. Not supported by the EVOTOR Digital Cash Register service
          type: string
          maxLength: 3
          minLength: 3
          pattern: ^\d+$
        documentType:
          description: |
            __Тег ФФД 1245.__ Код документа, удостверяющего личность. Допустимо указывать одно из значений справочника. Только для ФФД 1.2. Не поддерживается сервисом "Цифровая касса ЭВОТОР"
            
            Значение | Наименование
            ---------|---------------------------------
            21       | Паспорт гражданина Российской Федерации
            22       | Паспорт гражданина Российской Федерации, дипломатический паспорт, служебный паспорт, удостоверяющие личность гражданина Российской Федерации за пределами Российской Федерации
            26       | Временное удостоверение личности гражданина Российской Федерации, выдаваемое на период оформления паспорта гражданина Российской Федерации
            27       | Свидетельство о рождении гражданина Российской Федерации (для граждан Российской Федерации в возрасте до 14 лет)
            28       | Иные документы, признаваемые документами, удостоверяющими личность гражданина Российской Федерации в соответствии с законодательством Российской Федерации
            31       | Паспорт иностранного гражданина
            32       | Иные документы, признаваемые документами, удостоверяющими личность иностранного гражданина в соответствии с законодательством Российской Федерации и международным договором Российской Федерации
            33       | Документ, выданный иностранным государством и признаваемый в соответствии с международным договором Российской Федерации в качестве документа, удостоверяющего личность лица без гражданства.
            34       | Вид на жительство (для лиц без гражданства)
            35       | Разрешение на временное проживание (для лиц без гражданства)
            36       | Свидетельство о рассмотрении ходатайства о признании лица без гражданства беженцем на территории Российской Федерации по существу
            37       | Удостоверение беженца
            38       | Иные документы, признаваемые документами, удостоверяющими личность лиц без гражданства в соответствии с законодательством Российской Федерации и международным договором Российской Федерации
            40       | Документ, удостоверяющий личность лица, не имеющего действительного документа, удостоверяющего личность, на период рассмотрения заявления о признании гражданином Российской Федерации или о приеме в гражданство Российской Федерации            
          x-description-i18n:
            eng: |
              __FDF 1245 tag.__ Code of the identity document. One of the directory's values is allowed to be specified. Only for FDF 1.2. Not supported by the EVOTOR Digital Cash Register service
              
              Value    | Name
              ---------|---------------------------------
              21       | Russian Federation passport
              22       | Russian Federation passport, diplomatic passport, service passport certifying identity of the Russian Federation citizenship outside of the Russian Federation
              26       | Temporary Russian Federation citizenship ID card issued for the period of the issuance of the Russian Federation passport
              27       | Russian Federation birth certificate (for the Russian Federation citizens under the age of 14)
              28       | Other documents recognized as identity documents of the Russian Federation citizenship in accordance with the legislation of the Russian Federation
              31       | Passport of a foreign citizen
              32       | Other documents recognized as identity documents of a foreign citizen in accordance with the legislation of the Russian Federation and the international treaty of the Russian Federation
              33       | Document issued by a foreign state and recognized under the international treaty of the Russian Federation as a document certifying identity of a stateless person.
              34       | Residence permit (for stateless persons)
              35       | Temporary residence permit (for stateless persons)
              36       | Certificate of consideration of an application to recognize a stateless person as a refugee in the Russian Federation on the merits
              37       | Refugee identity card
              38       | Other documents recognized as identity documents of stateless persons in accordance with the legislation of the Russian Federation and the international treaty of the Russian Federation
              40       | Identity document of a person without a valid identity document, for the period of consideration of the application for the Russian Federation citizenship or acceptance of the Russian Federation citizenship            

          type: string
          maxLength: 2
          minLength: 2
          pattern: ^\d+$
        documentNo:
          description: __Тег ФФД 1246.__ Номер документа, удостоверяющего личность. Только для ФФД 1.2. Не поддерживается сервисом "Цифровая касса ЭВОТОР"
          x-description-i18n:
