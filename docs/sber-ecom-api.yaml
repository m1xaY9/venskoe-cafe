    post:
      tags:
        - basicServices
      summary: Регистрация заказа [register]
      x-summary-i18n:
        eng: Order registration [register]
      operationId: register
      description: |
        Запрос предназначен для регистрации (создания) заказа в Шлюзе. При успешной обработке запроса заказу присваивается номер (идентификатор), уникальный в рамках Шлюза. Метод используется для регистрации заказа с последующией оплатой любым способом:
          - оплата картой
          - оплата SberPay: подробное описание в разделе [Оплата с помощью SberPay](doc#section/Oplata-s-pomoshyu-SberPay)
          - оплата СБП: [подробное описание в документации](promo/SBP_integration.pdf)
      x-description-i18n:
        eng: |
          The query is intended for registration (creation) of the order in the Gateway. If the query is processed successfully, the order is assigned a number (identifier), unique within the Gateway. The method is used to register the order with a subsequent payment by any method:
            - payment with a card
            - SberPay payment: detailed description in [Paying with SberPay] (doc#section/Oplata-s-pomoshyu-SberPay)
            - FPS payment: [detailed description in the documentation](promo/eng_SBP_integration.pdf)
