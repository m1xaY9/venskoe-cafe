        - Y
        - N
      example: Y

    threedsDestinationNumberAttributes:
      description: Реквизиты получателя денежных средств для 3-D Secure
      x-description-i18n:
        eng: Payee's details for 3-D Secure
      type: object
      properties:
        destWalletNum:
          description: |
            Номер (идентификатор) электронного кошелька получателя электронных денежных средств.
            
            <span style="color:red;">Обязательно, если MCC=6050 или 6051</span>
          x-description-i18n:
            eng: |
              Payee's electronic wallet number (identifier).
              
              <span style="color:red;">Required if MCC=6050 or 6051</span>
          type: string
          maxLength: 30
          minLength: 1
          pattern: ^[ -~]*$
          example: "0123456789"
        destPhoneNum:
          description: |
            Номер телефона абонента получателя денежных средств.
            
            <span style="color:red;">Обязательно, если MCC=4814</span>
          x-description-i18n:
            eng: |
              Payee's phone number.
              
              <span style="color:red;">Required if MCC=4814</span>
          type: string
          maxLength: 30
          minLength: 1
          pattern: ^(\+?)\d{7,15}$
          example: "+79011234567"
        destCardNum:
          description: |
            Номер карты получателя перевода.
            
            <span style="color:red;">Обязательно при проведении операции перевода денежных средств на карту, кредитование, для MCC=6538</span>
          x-description-i18n:
            eng: |
              Payee's card number.
              
              <span style="color:red;">Required when performing a fund transfer to a card, original credit transaction, for MCC=6538</span>
          type: string
          maxLength: 19
          minLength: 13
          pattern: ^\d+$
          example: "2201382000000013"
        destAcctNum:
          description: |
            Конкатенированное значение БИК Банка (bik) получателя (044583999) и номер счета (bankAccount) получателя 40817810570000123456 для перевода
            
            <span style="color:red;">Обязательно при проведении операции перевода денежных средств на счет, кредитование, для MCC=6538</span>
          x-description-i18n:
            eng: |
              Concatenated value of the payee's Bank BIC (bik) (044583999) and the payee's account number (bankAccount) 40817810570000123456 for the transfer
              
              <span style="color:red;">Required when performing a fund transfer to a card, original credit transaction, for MCC=6538</span>
          type: string
          maxLength: 29
          minLength: 1
          pattern: ^\d+$
          example: "04458399940817810570000123456"
    
    threeDSMethodData:
      description: Значение объекта 3DS Method Data в кодировке base64url, если карта поддерживает 3DS Method и threeDSMNotificationUrl был передан в запросе
      x-description-i18n:
        eng: The value of the 3DS Method Data object in base64url encoding, if the card supports 3DS Method and threeDSMNotificationUrl was passed in the query
      type: string
      format: base64url
      maxLength: 4096
      minLength: 1
      pattern: ^[ -~]*$
