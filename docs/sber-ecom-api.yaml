      type: string
      maxLength: 36
      minLength: 1
      pattern: ^[ -~А-Яа-яЁёA-Za-z0-9-_№]*$
      example: e2574f1785324f1592d9029cb05adbbd

    orderOperation:
      description: |
        Тип операции, о которой формируется уведомление. Возможны следующие значения:
          * `created` = заказ создан;
          * `approved` = операция удержания (холдирования) суммы;
          * `deposited` = операция завершения;
          * `reversed` = операция отмены;
          * `refunded` = операция возврата;
          * `declinedByTimeout` = истекло время, отведенное на оплату заказа;
          * `subscriptionCreated` = подписка была создана Плательщиком.
      x-description-i18n:
        eng: |
          Type of transaction for which the notification is formed. The following values are possible:
            * `created` = order created;
            * `approved` = hold amount operation;
            * `deposited` = completion operation;
            * `reversed` = cancellation operation;
            * `refunded` = refund operation;
            * `declinedByTimeout` = order payment time is expired.
            * `subscriptionCreated` = subscription was created by the Payer.
      type: string
      maxLength: 20
      minLength: 1
      pattern: ^[A-Za-z0-9]*$
      example: deposited

    orderStatus:
      description: |
        По значению этого параметра определяется состояние заказа в платёжном шлюзе. Отсутствует, если заказ не был найден. Возможны следующие значения:
          * `0` = заказ зарегистрирован, но не оплачен;
          * `1` = сумма захолдирована (для двухстадийного сценария);
          * `2` = проведена полная авторизация суммы заказа / создана подписка СБП;
          * `3` = авторизация отменена;
          * `4` = по заказу была проведена операция возврата;
          * `5` = инициирована аутентификация через ACS Банка-эмитента;
          * `6` = авторизация отклонена.
      x-description-i18n:
        eng: |
          The value of this parameter specifies the order status in the payment gateway. Not available if the order was not found. The following values are possible:
            * `0` = order registered but not paid;
            * `1` = amount is on hold (for two-stage payment process);
            * `2` = the order amount has been fully authorized / FPS subscription has been created;
            * `3` = authorization cancelled;
            * `4` = refund operation was performed on the order;
            * `5` = authentication through the Issuing Bank's ACS is initiated;
            * `6` = Authorization denied.
      type: integer
      minimum: 0
      maximum: 9
      example: 2
      
