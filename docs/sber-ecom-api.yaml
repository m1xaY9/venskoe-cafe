    # Оплата с помощью SberPay
    При взаимодействии с Платежным шлюзом Партнеру доступен функционал оплаты с помощью SberPay в мобильном приложении "Сбербанк-Онлайн". 
    Имплементация функционала для достижения наилучших возможных показателей конверсии предусматривает соответствие платежного опыта Партнера с требованиями Банка, 
    описание функционала и примеры имплементации доступны в [ознакомительных материалах](promo/sponline.pdf).

    ## Оплата в APP-канале
    SberPay поддерживает платежный функционал в APP-канале. Применяются 2 схемы реализации платежного функционала:
    - SberPay SDK InApp
    - SberPay App2App 
 
    ### SberPay SDK InApp
    SDK – Это набор средств для разработки, благодаря которым можно легко интегрировать SberPay в мобильное приложение партнера и улучшить клиентский опыт.

    <a href='img/SPSDK_innApp_flow.png' target='_blank'><img src='img/SPSDK_innApp_flow.png'></a>
    
    Преимущества SDK InApp:
    •	Отсутствует потребность в доработках внедренного метода. Доработки и поддержку поверхности SDK InApp производит Банк;
    •	Повышает конверсию в оплату. На поверхности SDK InApp доступны все карты Сбера, отображается баланс и дополнительные финансовые сервисы Сбера;
    •	Продвинутый клиентский опыт. Минимальный клиентский путь. Поддержка длительной авторизации по куки. Не уводим клиентов с поверхности Партнера. Качественный UX/UI платежной поверхности;
    •	Санкции не влияют на стабильность работы SDK InApp.
    
    Материалы для разработчиков доступны по [ссылке](https://developers.sber.ru/docs/ru/sberpay-sdk/overview)
        
    ### SberPay App2App 
    Устаревший функционал SberPay позволяющий интегрировать SberPay в приложение партнера. Оплата подтверждается и производится в приложении Сбера посредством диплинка встраиваемого в кнопку оплаты со SberPay
    
    ## Оплата в WEB-канале
    SberPay поддерживает свой функционал оплаты на десктопных и мобильных WEB-сайтах. 
     
    ### SberPay WEB SDK
    WEB SDK позволяет интегрировать с веб-сайтом партнера нативную платежную поверхность SberPay. Это техническое решение является передовым клиентским опытов в SberPay и обладает преимуществами:
    
    <a href='img/websdk_flow.png' target='_blank'><img src='img/websdk_flow.png'></a>
    
    - Простое внедрение. Банк предоставляет готовую библиотеку, партнеру достаточно встроить ее на свой WEB-сайт;
    - Не уводим клиента с WEB-сайта. Для клиента оплата производится на сайте без переходов куда-либо. Удобная платежная штора позволяет видеть все карты клиента, их баланс и поддерживает финансовые сервисы Сбера;
    - Нет затрат на поддержку. Клиентский опыт на платежной поверхности обновляется и поддерживается силами Банка; 
    - Достаточно войти один раз. Если клиент авторизовался на платежной поверхности – мы его запомним. Последующие оплаты производятся бесшовно.
    
    Материалы для разработчиков доступны по [ссылке](https://developers.sber.ru/docs/ru/sberpay-sdk/overview)
    
    ### SberPay Web2App (нативная интеграция)
    Альтернативный платежный опыт нативной оплаты на WEB поверхностях без использования платежной страницы. 
    Функционал оплаты реализован по следующему сценарию:
    - Партнер выводит кнопку «Оплатить по номеру телефона». Для оплаты клиент вводит свой номер, привязанный к приложению Сбербанка. После чего ему направляется ПУШ или смс. По ПУШ или по ссылке в СМС – откроется приложение Сбербанка, где клиент подтверждает и завершает оплату.
    <span style="color:red;">ВАЖНО!</span> В данном платежном функционале требуется особо тщательное соблюдение UX/UI рекомендаций Банка.
    
    ### Платежная страница
    Платежная страница СберБанка по умолчанию устанавливается при подключении эквайринга СБЕРа. У партнера есть возможность подключить еще и оплату через SberPay на поверхности платежной страницы.
    Это простой и удобный способ совершать онлайн-покупки. Клиенту достаточно нажать на кнопку оплаты со SberPay и получить пуш-уведомление на телефон. Завершение оплаты производится в приложении СберБанка где клиенту доступна возможность выбрать любую карту из имеющихся.
    Вам не потребуется никаких доработок, если у вас подключен эквайринг СберБанка.
    Оставить заявку на подключение SberPay вы можете на [сайте](http://www.sberbank.ru/ru/s_m_business/bankingservice/sberpay)
    
