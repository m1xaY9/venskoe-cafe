          type: string
          maxLength: 45
          minLength: 1
          pattern: ^[ -~]*$
          example: 127.0.0.1
        browserJavaEnabled:
          description: Возможность браузера выполнять Java, значение свойства navigator.javaEnabled. Обязательно, если browserJavascriptEnabled = true
          x-description-i18n:
            eng: Enable the browser to execute Java, value of navigator.javaEnabled property. Mandatory if browserJavascriptEnabled = true
          type: boolean
          example: true
        browserJavascriptEnabled:
          description: Возможность браузера выполнять JavaScript. Обязательно для Browser-based операций.
          x-description-i18n:
            eng: Enable the browser to execute JavaScript. Mandatory for Browser-based operations.
          type: boolean
          example: true
        browserLanguage:
          description: Язык браузера согласно ETF BCP47, значение свойства navigator.language. Обязательно, если browserJavascriptEnabled = true
          x-description-i18n:
            eng: Browser language according to ETF BCP47, value of navigator.language property. Mandatory if browserJavascriptEnabled = true
          type: string
          maxLength: 8
          minLength: 1
          pattern: ^[ -~]*$
          example: ru
        browserColorDepth:
          description: |
            Битовая глубина цветовой палитры экрана, значение свойства screen.colorDepth. Обязательно, если browserJavascriptEnabled = true
              * `1` = 1 bit
              * `4` = 4 bits
              * `8` = 8 bits
              * `15` = 15 bits
              * `16` = 16 bits
              * `24` = 24 bits
              * `32` = 32 bits
              * `48` = 48 bits
          x-description-i18n:
            eng: |
              Bit depth of screen color palette, value of screen.colorDepth property. Mandatory if browserJavascriptEnabled = true
                * `1` = 1 bit
                * `4` = 4 bits
                * `8` = 8 bits
                * `15` = 15 bits
                * `16` = 16 bits
                * `24` = 24 bits
                * `32` = 32 bits
                * `48` = 48 bits
          enum:
            - 1
            - 4
            - 8
            - 15
            - 16
            - 24
            - 32
            - 48
          type: string
          example: "48"
        browserScreenHeight:
          description: Высота экрана в пикселях, значение свойства screen.height. Обязательно, если browserJavascriptEnabled = true
          x-description-i18n:
            eng: Screen height in pixels, value of screen.height property. Mandatory if browserJavascriptEnabled = true
          type: string
          maxLength: 6
          minLength: 1
          pattern: ^\d+$
          example: "1440"
        browserScreenWidth:
          description: Ширина экрана в пикселях, значение свойства screen.width. Обязательно, если browserJavascriptEnabled = true
          x-description-i18n:
            eng: Screen width in pixels, value of screen.width property. Mandatory if browserJavascriptEnabled = true
          type: string
          maxLength: 6
          minLength: 1
          pattern: ^\d+$
          example: "2560"
        browserTZ:
          description: Смещение в минутах между часовым поясом UTC и местным временем браузера. Обязательно, если browserJavascriptEnabled = true
          x-description-i18n:
            eng: Offset in minutes between UTC time zone and browser local time. Mandatory if browserJavascriptEnabled = true
          type: string
          maxLength: 5
          minLength: 1
          pattern: ^[ -~]*$
          example: "300"
        browserUserAgent:
          description: Содержимое заголовка HTTP user-agent. Обязательно для Browser-based операций
          x-description-i18n:
            eng: Contents of the HTTP user-agent header. Mandatory for Browser-based operations
          type: string
          maxLength: 2048
          minLength: 1
          pattern: ^[ -~]*$
          example: Mozilla/5.0 (Windows NT 6.1; Win64; x64; rv:47.0) Gecko/20100101 Firefox/47.0

