components:
  headers:
    idempotencyKey:
      description: |
        <span style="color:red;">__Функционал обработки ключа идемпотентности находится в разработке__</span>

        Ключ идемпотентности
      x-description-i18n:
        eng: |
          <span style="color:red;">__The idempotency key processing functionality is under development__</span>
          
          Idempotency key      
      required: true
      schema:
        type: string
        maxLength: 255
        minLength: 1
        pattern: ^[0-9a-zA-Z-_#]*$
      example: 779165e0-1905-4edd-89fa-be46497b5044

  parameters:
    idempotencyKey:
      name: x-idempotencyKey
      description: |
        <span style="color:red;">__Функционал обработки ключа идемпотентности находится в разработке__</span>

        Ключ идемпотентности запроса. Повторный вызов с тем же ключом вернет результат выполнения предыдущего запроса и не приведет к выполнению нового. Срок хранения ключей - 24 часа. 
      x-description-i18n:
        eng: |
          <span style="color:red;">__The idempotency key processing functionality is under development__</span>
          
          Query idempotency key. A repeated call with the same key will return the result of the previous query and will not result in the execution of the new one. The keys remain in storage for 24 hours. 
      in: header
      schema:
        type: string
        maxLength: 255
        minLength: 1
        pattern: ^[0-9a-zA-Z-_#]*$
      example: 779165e0-1905-4edd-89fa-be46497b5044

  schemas:
    acsDecoupleIndicator:
      description: |
        Признак обработки операции оплаты по сценарию отложенной аутентификации. Допустимые значения:
          * `Y` = используется отложенная аутентификация
      x-description-i18n:
        eng: |
          Attribute of payment transaction processing in case of decoupled authentication. Allowable values:
            * `Y` = decoupled authentication is used
      type: string
      maxLength: 1
      minLength: 1
      enum:
        - Y
      pattern: ^[ -~]*$
      example: Y
    
    acsRenderingType:
      description: Шаблон UI, выбранный ACS из поддерживаемых SDK для проведения Challenge с Плательщиком в сценарии Application-based. Передается в кодировке base64
      x-description-i18n:
        eng: UI template selected by ACS from the supported SDK to conduct Challenge with the Payer in the Application-based scenario. Transmitted in base64 encoding
      type: string
      format: base64
      maxLength: 256
      minLength: 1
      pattern: ^[ -~]*$
      example: eyJhY3NSZW5kZXJpbmdUeXBlIjp7ImFjc0ludGVyZmFjZSI6IjAyIiwiYWNzVWlUZW1wbGF0ZSI6IjAzIn19

    acsSignedContent:
      description: Параметры ACS для проведения Challenge с Плательщиком в сценарии Application-based
      x-description-i18n:
        eng: ACS parameters to conduct Challenge with the Payer in the Application-based scenario
      type: string
      maxLength: 64000
      minLength: 1
      pattern: ^[ -~]*$
      example: eyJ4NWM ... 6iijPAIqV-aoEeIg

    acsUrl:
      description: Адрес ACS Банка-эмитента для проведения 3-D Secure аутентификации Карты Плательщика. Не используется при платежах, не требующих дополнительной аутентификации на ACS Банка-эмитента.
      x-description-i18n:
        eng: Address of the Issuing Bank's ACS for a 3-D Secure authentication of the Payer Card. Not used for the payments that do not require an additional authentication at the Issuing Bank's ACS.
      type: string
      maxLength: 2048
      minLength: 1
      pattern: ^[ -~]*$
      example: https://acs.vendorcert.mirconnect.ru/mdpayacs/creq

    actionCode:
      description: Код ответа платёжного шлюза - цифровое обозначение результата, к которому привело обращение со стороны Партнера
      x-description-i18n:
        eng: Response code of the payment gateway is a numeric designation of the result produced by Merchant query
      type: integer
      minimum: -9999999
      maximum: 9999999
      example: 0

    actionCodeDescription:
      description: Расшифровка кода ответа на языке, переданном в параметре запроса language
      x-description-i18n:
        eng: Deciphering of the response code in the language transmitted in the language request parameter
      type: string
      maxLength: 512
      minLength: 0
      pattern: ^[ -~А-Яа-яЁё№]*$
      example: ""

    additionalOfdParams:
      description: Блок, содержащий список параметров для ОФД
      x-description-i18n:
        eng: Block with the list of parameters for FDO
      type: object
      example: {"name1":"value1", "name2":"value2"}

    additionalParams:
      description: Дополнительные параметры операции. Используется также при создании подписки СБП.
      x-description-i18n:
        eng: Additional operation parameters. Used when creating FPS subscription and other.
      type: object
      properties:
        value:
          $ref: '#/components/schemas/value'
      example: {}
      additionalProperties: false

    amount:
      description: Сумма операции в минимальных единицах валюты
      x-description-i18n:
        eng: Transaction amount in minor units of currency
      type: integer
      maximum: 999999999999
      minimum: 0
      example: 19900

    approvalCode:
      description: Код авторизации платежа
      x-description-i18n:
        eng: Payment authorization code
      type: string
      maxLength: 6
      minLength: 1
      pattern: ^\w+$
      example: "433187"

    attributes:
      description: Дополнительные параметры заказа со стороны ПШ. Элемент присутствует в ответе, если заказ успешно создался
      x-description-i18n:
        eng: Additional order parameters on the PG side The element is present in the response if the order has been successfully created
      type: array
      items:
        type: object
        properties:
          name:
            description: Имя передаваемого параметра для различных свойств заказа
            x-description-i18n:
              eng: Name of the transmitted parameter for various order properties
            type: string
            maxLength: 20
            minLength: 1
            pattern: ^[A-Za-z]*$
            example: mdOrder
          value:
            description: Значение передаваемого параметра для различных свойств заказа
            x-description-i18n:
              eng: Value of the transmitted parameter for various order properties
            type: string
            maxLength: 1024
            minLength: 1
            pattern: ^[ -~]*$
            example: a67b0ced-c9a4-4cfb-bce3-b9595afaafc1
        additionalProperties: false

    authDateTime:
      description: Дата и время авторизации в Банке-эквайрере в формате UNIX-времени (POSIX-времени)
      x-description-i18n:
        eng: Date and time of authorization in the Acquiring Bank in UNIX time (POSIX time) format.
      type: number
      minimum: 0
      maximum: 999999999999999
      example: 1636985192232

    authRefNum:
      description: Ссылочный номер авторизации платежа, который присваивается при регистрации платежа на стороне платёжной системы
      x-description-i18n:
        eng: Payment authorization reference number assigned when registering the payment on the payment system side
      type: string
      maxLength: 24
      minLength: 0
      pattern: ^[A-Za-z0-9]+$
      example: "303112098637"

    autocompletionDate:
      description: |
        Дата и время автоматического подтверждения заказа в формате yyyy-MM-ddTHH:mm:ss. Если передан параметр, то вызов метода deposit не требуется.
      x-description-i18n:
        eng: |
          Date and time of automatic order confirmation in the yyyy-MM-ddTHH:mm:ss format. If the parameter is passed, no deposit method call is required.
      type: string
      format: date-time
      example: 2023-09-13T16:05:00

    autoCompletionRequest:
      type: object
      required:
        - userName
        - password
