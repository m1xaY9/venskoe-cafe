  /ecomm/gw/partner/api/ofd/v1/getMarkStatus:
    post:
      tags:
        - fiscalizationServices
      summary: Получение статуса кода маркировки через ТС ПИоТ. [getMarkStatus]
      x-summary-i18n:
        eng: Get mark code status service [getMarkStatus]
      operationId: getMarkStatus
      description: |
        Сервис для получения статуса кода маркировки в рамках разрешительного режима продажи маркированных товаров. Позволяет осуществлять проверку КМ через ТС ПИоТ.
        
          *	Сервис работает с сервисами фискализации Цифровая касса Эвотор, АТОЛ Онлайн <span style="color:red;">(__на текущий момент доступно только тестирование__)</span>, Бизнес.Ру Онлайн-чеки. 
          *	Запрос должен содержать merchantId либо userName и merchantLogin. По умолчанию userName и merchantLogin совпадают.
          *	Максимальное количество КМ в одном запросе — 99.
          *	Максимальное время ожидания ответа может составлять до 60 секунд.
          
        Интерпретация результата:
        
        АТОЛ Онлайн: реализация данного КМ разрешена при "canBeSold": true; 
        
        Цифровая касса Эвотор: реализация данного КМ разрешена при "allowed": true;
        
        Бизнес.Ру Онлайн-чеки: необходимо самостоятельно анализировать возвращаемые от сервиса объекты;
        
        Получениe ошибки 203 в error.code означает ввод аварийного режима со стороны ЦРПТ и позволяет продажу маркированного товара без проверки.


      x-description-i18n:
        eng: |
          Service for obtaining the status of a marking code within the framework of the permit regime for the sale of labeled goods. Allows to check KM via P&T TS.
          * The service works with fiscalization services Digital cash desk Evotor, ATOL Online, Business.Ru Online checks.
          * The query must contain merchantId or userName and merchantLogin. By default, userName and merchantLogin are the same.
          * The maximum number of KMs per request is 99.
          * Maximum response timeout can be up to 60 seconds.
      requestBody:
        description: Запрос статуса кода маркировки
        x-description-i18n:
          eng: Query for mark code status
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/getMarkStatusRequest'
            example:
