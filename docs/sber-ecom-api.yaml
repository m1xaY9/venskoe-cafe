    unBindCardResponse:
      type: object
      required:
        - errorCode
      properties:
        errorCode:
          $ref: '#/components/schemas/errorCode'
        errorMessage:
          $ref: '#/components/schemas/errorMessage'
      additionalProperties: false

    userName:
      description: Логин Партнера, полученный при подключении к ПШ
      x-description-i18n:
        eng: Merchant's login received at the time of connection to PG
      type: string
      maxLength: 30
      minLength: 1
      pattern: ^[A-Za-z0-9-_-]+$
      example: testUserName

    value:
      description: |
        Строка, содержащая информацию о подписках СБП. Включает в себя следующие значения:
          * phone - Маскированный Номер телефона Плательщика в формате ***********XXXX
          * subscriptionId - Идентификатор сохраненной подписки для Агента
          * memberId - Идентификатор Банка отправителя, где сохранена подписка для Агента
          * extTransactionId - Идентификатор Операции СБП C2B
          * qrcId - Идентификатор функциональной ссылки
      x-description-i18n: 
        eng: |
          SBP subscription string. Uncluding:
            * phone - Payer's masked phone number in the format ***********XXXX
            * subscriptionId - ID of the stored subscription for the Agent
            * memberId - Sending Bank ID where the Agent subscription is stored
            * extTransactionId - SBP C2B transaction identifier
            * qrcId - Valid QR code (functional link) identifier            
      type: string
    
    xid:
      description: Уникальный идентификатор 3-D Secure аутентификации (xid или dsTransId)
      x-description-i18n:
        eng: Unique identifier of 3-D Secure authentication (xid or dsTransId)
      type: string
      maxLength: 36
      minLength: 28
      pattern: ^[ -~]+$
