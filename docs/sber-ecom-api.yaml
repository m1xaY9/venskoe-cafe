    tdsApplicationAttributes:
      description: Параметры 3DS SDK для проведения 3-D Secure аутентификации на стороне ПШ
      x-description-i18n:
        eng: 3DS SDK parameters for 3-D Secure authentication on the PG side
      type: object
      required:
        - deviceCategory
        - sdkAppID
        - sdkReferenceNumber
        - sdkTransID
        - sdkEncData
        - sdkEphemPubKey
      properties:
        deviceCategory:
          type: string
          description: |
            Категория устройства, в котором инициирована аутентификация 3-D Secure. Допустимые значения:
              * `0` (BRW) = аутентификация инициирована в браузере Плательщика (по умолчанию);
              * `1` (APP) = аутентификация инициирована в мобильном приложении Плательщика;
              * `2` (3RI) = аутентификация инициирована сервером ТСТ.
          x-description-i18n:
            eng: |
              Device category which 3-D Secure authentication is initiated in. Allowable values:
                * `0` (BRW) = authentication is initiated in the Payer’s browser (by default);
                * `1` (APP) = authentication is initiated in the Payer’s mobile app;
                * `2` (3RI) = authentication is initiated by the Merchant’s server.
          maxLength: 1
          minLength: 1
          default: "0"
          pattern: ^[ -~]*$
          example: "1"
        sdkAppID:
          description: Идентификатор в формате uuid, создаваемый при каждой установке приложения ТСТ и хранимый в 3DS SDK. Обязательно для deviceCategory = 1
          x-description-i18n:
            eng: Uuid-format identifier created during each installation of the POS application and stored in 3DS SDK. Mandatory for deviceCategory = 1
          type: string
          format: uuid
          maxLength: 36
          minLength: 1
          pattern: ^[ -~]*$
          example: dbd64fcb-c19a-4728-8849-e3d50bfdde39
        sdkReferenceNumber:
          description: Идентификатор вендора и версии 3DS SDK, присвоенный EMVCo. Обязательно для deviceCategory = 1
          x-description-i18n:
            eng: Identifier of vendor and 3DS SDK version assigned by EMVCo. Mandatory for deviceCategory = 1
          type: string
          maxLength: 32
          minLength: 1
          pattern: ^[ -~]*$
          example: 3DS_LOA_SDK_PPFU_020100_00007
        sdkTransID:
          description: Идентификатор в формате uuid, присваиваемый 3DS SDK для каждого запроса аутентификации. Обязательно для deviceCategory = 1
          x-description-i18n:
            eng: Uuid-format identifier assigned to 3DS SDK for each authentication request. Mandatory for deviceCategory = 1
          type: string
          format: uuid
          maxLength: 36
          minLength: 1
          pattern: ^[ -~]*$
          example: b2385523-a66c-4907-ac3c-91848e8c0067
        sdkMaxTimeout: 
          description: Максимальное время в минутах для проведения аутентификации (должно быть не меньше 5). По умолчанию присваивается значение 5
          x-description-i18n:
            eng: Maximum time in minutes for authentication (should be no less than 5). Default value is 5
          type: string
          maxLength: 2
          minLength: 1
          default: "5"
          pattern: ^[ -~]*$
          example: "5"
        sdkEncData:
          description: Информация об устройстве Плательщика. Обязательно для deviceCategory = 1
          x-description-i18n:
            eng: Payer’s device data. Mandatory for deviceCategory = 1
          type: string
          maxLength: 64000
          minLength: 1
          pattern: ^[ -~]*$
          example: "eyJlbmMiOiJBMT ... ZkkA.4eUVBCy-xDGm3njvQJb_Mw"
        sdkEphemPubKey:
          description: Сессионный публичный ключ, генерируемый 3DS SDK для каждого запроса аутентификации, передаваемый в кодировке base64. Обязательно для deviceCategory = 1
          x-description-i18n:
            eng: Session public key generated by 3DS SDK for each authentication request, transmitted in base64 encoding. Mandatory for deviceCategory = 1
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^[ -~]*$
          example: eyJrdHkiOiJFQyIsImNydiI6IlAtMjU2IiwieCI6IldXY3BUamJPcWl1XzFhT0RsbHc1cllUcTVvTFhFX1QwaHVDUGpNSVJia0kiLCJ5IjoiV3pfN2FuSWVhZFY4U0paVWZyNGRyd2p6dVdvVWJPc0hwNUdkUlpCQUFpdyJ9
        deviceRenderOptions:
          description: Объект с типами UI, поддерживаемыми 3DS SDK и приложением ТСТ, передаваемый в кодировке base64. По умолчанию поддерживаются все возможные типы UI
          x-description-i18n:
            eng: Object with UI types supported by 3DS SDK and POS application, transmitted in base64 encoded. By default, all possible UI types are supported.
          type: string
          format: base64
          maxLength: 256
          minLength: 1
          pattern: ^[ -~]*$
          example: eyJkZXZpY2VSZW5kZXJPcHRpb25zIjp7InNka0ludGVyZmFjZSI6IjAzIiwic2RrVWlUeXBlIjpbIjAxIiwiMDIiLCIwMyIsIjA0IiwiMDUiXX19

    tdsBrowserAttributes:
      description: Параметры браузера для проведения 3-D Secure аутентификации на стороне ПШ
      x-description-i18n:
        eng: Browser parameters to perform 3-D Secure authentication on the PG side
      type: object
      required:
        - browserAcceptHeader
        - browserIP
        - browserJavascriptEnabled
        - browserUserAgent
      properties:
        challengeWindowSize:
          description: |
            Разрешение страниц ACS, в случае проведения Challenge с Плательщиком по протоколу 3-D Secure на базе EMV 2.x.x
              * `01` = 250x400
              * `02` = 390x400 (по умолчанию)
              * `03` = 500x600
              * `04` = 600x400
              * `05` = Full screen
          x-description-i18n:
            eng: |
              ACS page resolution in case of Challenge with the Payer on 3-D Secure protocol based on EMV 2.x.x
                * `01` = 250x400
                * `02` = 390x400 (default)
                * `03` = 500x600
                * `04` = 600x400
                * `05` = Full screen
          type: string
          maxLength: 2
          minLength: 2
          pattern: ^\d+$
          default: "02"
          example: "02"
        browserAcceptHeader:
          description: Содержимое HTTP accept headers браузера Плательщика. Обязательно для Browser-based операций
          x-description-i18n:
            eng: Exact content of the HTTP accept headers as sent to the 3DS Requestor from the Cardholder’s browser.
          type: string
          maxLength: 2048
          minLength: 1
          pattern: ^[ -~]*$
          example: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        browserIP:
          description: IP адрес Плательщика, полученный из HTTP заголовков браузера. Обязательно для Browser-based операций
          x-description-i18n:
