              * `04` = Login to the cardholder account at the 3DS Requestor system using issuer credentials;
              * `05` = Login to the cardholder account at the 3DS Requestor system using third-party authentication;
              * `06` = Login to the cardholder account at the 3DS Requestor system using FIDO Authenticator;
              * `07` = Login to the cardholder account at the 3DS Requestor system using FIDO Authenticator;
              * `08` = SRC Assurance Data;
              * `09`–`79` = Reserved for EMVCo future use (values invalid until defined by EMVCo);
              * `80`–`99` = Reserved for DS use.
          x-description-i18n:
            eng: |
              Payer's authentication method in Merchant:
                * `01` = No 3DS Requestor authentication occurred (i.e. cardholder “logged in” as guest);
                * `02` = Login to the cardholder account at the 3DS Requestor system using 3DS Requestor's own credentials;
                * `03` = Login to the cardholder account at the 3DS Requestor system using federated ID;
                * `04` = Login to the cardholder account at the 3DS Requestor system using issuer credentials;
                * `05` = Login to the cardholder account at the 3DS Requestor system using third-party authentication;
                * `06` = Login to the cardholder account at the 3DS Requestor system using FIDO Authenticator;
                * `07` = Login to the cardholder account at the 3DS Requestor system using FIDO Authenticator;
                * `08` = SRC Assurance Data;
                * `09`–`79` = Reserved for EMVCo future use (values invalid until defined by EMVCo);
                * `80`–`99` = Reserved for DS use.
          type: string
          maxLength: 2
          minLength: 2
          pattern: ^\d+$
        threeDSReqAuthTimestamp:
          description: Дата и время в UTC аутентификации Плательщика в ТСП в формате YYYYMMDDHHMM
          x-description-i18n:
            eng: UTC date and time of Payer's authentication in Merchant in YYYYMMDDHHMM format
          type: string
          maxLength: 12
          minLength: 12
          pattern: ^\d+$
        acctType:
          description: |
            Тип счета карты Плательщика:
              * `01` = Not Applicable;
              * `02` = Credit;
              * `03` = Debit;
              * `04`–`79` = Reserved for EMVCo future use (values invalid until defined by EMVCo);
              * `80`–`99` = DS or Payment System-specific.
          x-description-i18n:
            eng: |
              Payer’s card type:
                * `01` = Not Applicable;
                * `02` = Credit;
                * `03` = Debit;
                * `04`–`79` = Reserved for EMVCo future use (values invalid until defined by EMVCo);
                * `80`–`99` = DS or Payment System-specific.
          type: string
          maxLength: 2
          minLength: 2
          pattern: ^\d+$
        transType:
          description: |
            Тип операции:
              * `01` = Goods/ Service Purchase;
              * `03` = Check Acceptance;
              * `10` = Account Funding;
              * `11` = Quasi-Cash Transaction;
              * `28` = Prepaid Activation and Load.
          x-description-i18n:
            eng: |
              Transaction type:
                * `01` = Goods/ Service Purchase;
                * `03` = Check Acceptance;
                * `10` = Account Funding;
                * `11` = Quasi-Cash Transaction;
                * `28` = Prepaid Activation and Load.
          type: string
          maxLength: 2
          minLength: 2
          pattern: ^\d+$
        addrMatch:
          description: |
            Признак соответствия адреса доставки товара и адреса доставки счета:
              * `Y` = Shipping Address matches Billing Address;
              * `N` = Shipping Address does not match Billing Address.
          x-description-i18n:
            eng: |
              Indicator of identity of the shipping address and billing address:
                * `Y` = Shipping Address matches Billing Address;
                * `N` = Shipping Address does not match Billing Address.
          type: string
          maxLength: 1
          minLength: 1
          pattern: ^[A-Za-z]*$
        threeDSRequestorChallengeInd:
          description: |
            Признак необходимости проведения Challenge c Плательщиком:
              * `01` = No preference;
              * `02` = No challenge requested;
              * `03` = Challenge requested 3DS Requestor Preference;
              * `04` = Challenge requested Mandate;
              * `05`–`79` = Reserved for EMVCo future use (values invalid until defined by EMVCo);
              * `80`-`99` = Reserved for DS use.
          x-description-i18n:
            eng: |
              Indicator of required Challenge with the Payer:
                * `01` = No preference;
                * `02` = No challenge requested;
                * `03` = Challenge requested 3DS Requestor Preference;
                * `04` = Challenge requested Mandate;
                * `05`–`79` = Reserved for EMVCo future use (values invalid until defined by EMVCo);
                * `80`-`99` = Reserved for DS use.
          type: string
          maxLength: 2
          minLength: 2
          pattern: ^\d+$
        purchaseInstalData:
