    dynamicCallbackUrl:
      description: |
        Адрес, на который требуется направить callback. Если параметр отсутствует - используется адрес, указанный в настройках мерчанта
        
        <span style="color:red;">__Обратите внимание!__</span>
        1. Если доменное имя содержит кирилические символы, то его необходимо преобразовать по алгоритму ACE. Т.е. строка "сберпей.рф" будет выглядеть как "xn--90aiaq2afe.xn--p1ai"
        2. Если query параметр содержит символ % - считается, что к данному параметру уже применено экранирование и преобразование не осуществляется (параметр остается "как есть")
        3. Если query параметр содержит символы, отличные от множества [a-zA-Z0-9.-*_ ], эти символы экранируются через символ %. Строка вида "сберпей.рф" будет выглядеть как "%D1%81%D0%B1%D0%B5%D1%80%D0%BF%D0%B5%D0%B9%2E%D1%80%D1%84"
      x-description-i18n:
        eng: |
          The address to which you want to send the callback. If the parameter is missing, the URL specified in the merchant settings is used
              
          <span style="color:red;">__Pay attention!__</span>
          1. If the domain name contains Cyrillic characters, then it must be converted using the ACE algorithm. I.e. the string "сберпей.рф" will look like "xn--90aiaq2afe.xn--p1ai"
          2. If the query parameter contains the % symbol, it is assumed that escaping has already been applied to this parameter and no conversion is performed (the parameter remains "as is")
          3. If the query parameter contains characters other than the set [a-zA-Z0-9.-*_ ], these characters are escaped through the % symbol. A string of the type "сберпей.рф" will look like "%D1%81%D0%B1%D0%B5%D1%80%D0%BF%D0%B5%D0%B9%2E%D1%80%D1%84"
      type: string
      maxLength: 512
      minLength: 12
      pattern: ^(https://).*$
      example: https://testmerchant.ru/callback

