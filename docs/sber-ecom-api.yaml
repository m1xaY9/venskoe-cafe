    ### Оплата с использованием связок

    Общий алгоритм проведения оплаты по связке.
    
    Сценарий разбит на два этапа:
    
    ##### 1. Создание связки.
    
     <a href='img/sequence_binding_create.png' target='_blank'><img src='img/sequence_binding_create.png'></a>
    
    Ниже приведено краткое описание алгоритма создания связки.
    
    
    1.1. После получения согласия со стороны Плательщика на дальнейшее использование данных карты для проведения оплат, Партнер регистрирует заказ с помощью register.do (с обязательной передачей параметра clientId). 

    <span style="color:red;">__Внимание!__</span> В случае отсутствия указанного параметра (clientId) в запросе - связка не будет создана. 
    В запросе также может быть передан features=VERIFY. В этом случае сумма заказа должна составлять 0 рублей 0 копеек, средства с Плательщика не списываются. При этом сохраняется проведение всех необходимых проверок. Данный способ регистрации заказа является наиболее корректным для формирования связок.
    
    1.2. Плательщик оплачивает заказ со всеми атрибутами: вводом карточных данных и 3DS или оплатой операции через SberPay.
    
    1.3. При успешной оплате заказа будет создана связка, идентификатор которой можно будет получить с помощью запросов getOrderStatusExtended.do и/или getBindings.do.

    1.4. Опциональный шаг. При необходимости возврата средств по заказу (при авторизации на сумму, отличную от 0 рублей 0 копеек) может быть направлен запрос reverse.do. Отмена требуется для предотвращения фактического списания средств в случае использования технической операции для привязки карты.
    
    ___Создание связки завершено.___
    
    ##### 2. Оплата с использованием связки
    
    <a href='img/sequence_binding_payment.png' target='_blank'><img src='img/sequence_binding_payment.png'></a>
    
    Ниже приведено краткое описание алгоритма проведения оплаты с использованием имеющейся связки.
    
    Доступно несколько путей оплаты, инициатором которой может выступать как Плательщик, так и Партнер.
    
    1. Инициатором выступает Партнер.
    
    Способ 1.
    
    1.1.1. Партнер отправляет запрос recurrentPayment.do.
    
    1.1.2. Платежный шлюз обогащает запрос данными карты, соответствующими полученному от Партнера bindingId.
    
    1.1.3. Проводится авторизация с использованием данных карт, заполненных в п. 1.1.2.
    
    1.1.4. Партнеру направляется результат авторизации.
    
    Способ 2.
    
    1.2.1. Партнер регистрирует заказ с помощью register.do / registerPreAuth.do с обязательной передачей параметра clientId.
    
    1.2.2. Инициируется оплата заказа с помощью paymentOrderBinding.do с передачей параметра bindingId.
    
    <span style="color:red;"> __Внимание!__ </span> Параметр bindingId должен соответствовать переданному при регистрации заказа clientId. В случае попытки оплаты связкой, созданной для другого clientId вернется ошибка "Заказ не может быть оплачен данной связкой"
    
    1.2.3. Платежный шлюз проверяет соответствие clientId и bindingId. При корректном результате проверки Платежный шлюз обогащает запрос данными карты, соответствующими переданному значению bindingId.
    
    1.2.4. Проводится авторизация с использованием данных карт, заполненных в п. 1.2.3.
    
    1.2.5. Партнеру направляется результат авторизации.
    
    2. Инициатором выступает Плательщик.
    
    2.1. Плательщик выбирает оплату сохраненной картой.
    
    2.2. Партнер регистрирует заказ с помощью register.do / registerPreAuth.do с обязательной передачей параметра clientId.
    
    2.3. Инициируется оплата заказа с помощью paymentOrderBinding.do с передачей параметра bindingId.
    
    <span style="color:red;"> __Внимание!__</span> Параметр bindingId должен соответствовать переданному при регистрации заказа clientId. В случае попытки оплаты связкой, созданной для другого clientId вернется ошибка "Заказ не может быть оплачен данной связкой"
    
    2.4. Платежный шлюз проверяет соответствие clientId и bindingId. При корректном результате проверки Платежный шлюз обогащает запрос данными карты, соответствующими переданному значению bindingId.
    
    2.5. Проводится авторизация с использованием данных карт, заполненных в п. 1.2.3.
    
    2.6. Партнеру направляется результат авторизации.
    
    2.7. Партнер оповещает Плательщика о результате авторизации.
    
    ##### 3. Расширенный сценарий оплаты с использованием связки
    
    <a href='img/sequence_binding_new_payment.png' target='_blank'><img src='img/sequence_binding_new_payment.png'></a>
       
    Расширение сценария осуществляется на шаге оплаты связкой. Расширенный сценарий применим только к связкам для карт Сбера. При попытке провести оплату по связке с недостаточным балансом или заблокированной картой, в ответе будет содержаться errorCode "0", error: "Запрос принят в обработку", info: "Запрос принят в обработку", эти коды и описания являются основным сигналом о том, что оплата не прошла успешно и сценарий идет по расширенной логике. При запросе getOrderStatusExtended actionCode сменится на 0, actionCodeDescription "Запрос принят в обработку" (новый статус). Этот статус у заказа будет сохраняться до оплаты заказа плательщиком или до истечения срока его жизни.
    
    Обратите внимание:
    
    1. Логика обработки features в запросах register/registerPreAuth теперь единая как для карточных bindingId, так и для bindingId SberPay, в случае если требуется использовать принудительное подтверждение операции разовым кодом передаются атрибуты FORCE_TDS/FORCE_FULL_TDS, а для случаев когда подтверждение не требуется AUTO_PAYMENT/FORCE_SSL.
    2. При реализации опыта через SDK SberPay (когда плательщик в момент оплаты находится на витрине) в запросе register также требуется передача [bindingId](https://ecomtest.sberbank.ru/doc#tag/basicServices/operation/register)
    3. Исключить регистрацию заказов со сроком действия менее 5 минут, так как при расширенной логике попытки регистрации заказа не пройдут валидацию на платежном шлюзе и отобьются ошибкой.
    4. Поддержать обработку нового error и info не предпринимать действий с заказом до его перехода в другой статус.    
    5. Должна быть реализована поддержка нотификаций по событиям со [связками](https://ecomtest.sberbank.ru/doc#tag/callbackServices/operation/bindingCallback) и [заказами](https://ecomtest.sberbank.ru/doc#tag/callbackServices/operation/callback).    
    6. Требуется учесть что в случае срабатываний расширенного опыта оплаты связкой возможно изменение карточных данных в существующей связке (если карта была заблокирована), кроме того возможна ситуация когда в getOrderStatusExtended вернется bindingId отличный от того с которым была инициирована оплата (случай недостатка средств)
    
    **Внимание!** При несоответствии clientId и bindingId Партнеру возвращается ошибка "Заказ не может быть оплачен данной связкой".

    ## Повышение конверсии платежей
    В сфере электронной коммерции конверсия является одним из важнейших показателей. При корректной интеграции и интуитивном клиентском пути одним из основных способов улучшения показателей является передача дополнительных параметров.
    
    Дополнительные параметры позволяют получить более полную информацию о клиентах и их платежных операциях, позволяя весомо снизить риски мошенничества и исключить избыточные блокировки операций со стороны Банка, НСПК и иных эмитентов. Передача дополнительных параметров доступна при регистрации заказа и в сервисах оплаты в блоках __jsonParams__ или __additionalParameters__ в соответствии с описанием сервиса в документации.
 
    __Передача корзины и идентификатора аккаунта плательщика__ партнера являются наиболее весомыми факторами, позволяющими повысить конверсию. Передача корзины заказа может использоваться без функционала фискализации.
 
    Дополнительные параметры могут пересекаться с параметрами 3DS и в большинстве случаев влияют на результат аутентификации плательщика, повышая вероятность работы по frictionless flow.  
 
