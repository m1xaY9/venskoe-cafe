  /ecomm/gw/partner/api/ofd/v1/doCorrection:
    post:
      tags:
        - fiscalizationServices
      summary: Чеки коррекции [doCorrection]
      x-summary-i18n:
        eng: Correction receipt [doCorrection]
      operationId: doCorrection
      description: |
        Сервис позволяет формировать чеки коррекции. Поддерживается кассовыми сервисами Цифровая касса Эвотор, АТОЛ Онлайн, Ferma OFD.RU
        
        Общие правила работы с сервисом:
        
        В сервис необходимо передать корзину с receiptType желаемого чека коррекции. Например, для исправления чека с типом «Приход» необходимо передать "receiptType": "sell_correction", «Возврат прихода» - "receiptType": "sell_refund_correction". В связи с особенностью корректировки существующих чеков в ФФД 1.05 типы создаваемых чеков автоматически будут определены как "sell" и "sell_refund", а в случае создания новых чеков коррекции - как "sell_correction" и "buy_correction".
        При наличии receiptId в запросе, система автоматически найдет и сформирует обратный чек, включив в него ФП (фискальный признак) некорректного чека в теге 1192, и, при необходимости, блок correctionInfo.
        В запрос необходимо всегда включать correctionInfo, за исключением исправления существующего чека при работе с ФФД 1.05.
        
        Доступно 2 режима формирования чеков коррекции: 
        * для исправления ошибки в существующем чеке (успешно зарегистрированном в кассовом сервисе), 
        * для создания чека коррекции в случаях, когда фискальный чек не сформировался по каким то причинам (не были указаны настройки кассы, ошибки в формате запросов, массовом сбое и т.д.)
        
        __Создание нового чека коррекции__:
          1. В сервисе doCorrection передать корзину с с receiptType желаемого чека коррекции, и блок correctionInfo.
          2. Будет создан чек коррекции на основании запроса doCorrection с указанном в нем receiptType;
          3. В случае, если у чека есть receiptId, но он неуспешен, для его исправления не нужно передавать receiptId.
        
        __Исправление успешно зарегистрированного чека__:
          1. В сервисе doCorrection передать корзину, receiptId корректируемого чека, блок correctionInfo. Блок не нужно передавать в ФФД 1.05.
          2. Предполагается передача receiptId только успешного чека. Для исправления незарегистрированного чека в сервис doReceipt передавать receiptId не нужно.
          3. Для отмены некорректного чека будет автоматически сформирован обратный чек с включением в него ФД некорректного чека.
          4. Чек коррекции будет создан на основании переданного receiptType в doCorrection.
          
        __При необходимости отменить (аннулировать) чек, зарегистрированный по ошибке__ (случайный дубль, ошибка при создании чека коррекции), без создания корректирующего чека, рекомендуется:
        
          __для ФФД 1.05__
          
          Используя сервис doReceipt, передать полностью зеркальный чек, используя обратный receiptType: для изначального SELL это SELL_REFUND, для изначального SELL_REFUND это SELL. В объект additionalCheckProps (тег 1192) передать фискальный признак (fiscalDocumentAttribute из ответа getReceiptStatus) отменяемого чека. Заполнять correctionInfo и receiptId не нужно.
          Таким образом будет сформирован 1 чек на отмену лишнего чека.
            
          __для ФФД 1.2__
          
          Используя сервис doCorrection, передать полностью зеркальный чек, используя обратный, но с флагом коррекции, receiptType: для изначального SELL это SELL_REFUND_CORRECTION, для изначального SELL_REFUND это SELL_CORRECTION. В объект additionalCheckProps (тег 1192) передать фискальный признак (fiscalDocumentAttribute из ответа getReceiptStatus) отменяемого чека. Заполнить correctionInfo. Заполнять receiptId не нужно.
          Таким образом будет сформирован 1 чек коррекции на отмену лишнего чека.

      x-description-i18n:
        eng: |
          The service allows you to form correction checks.
          General rules for working with the service:
          You need to transfer the basket with the receiptType of the desired correction check to the service. For example, to correct a receipt of type ReceiptType, pass "receiptType": "sell_correction"," ReceiptType ":" sell_refund_correction". Due to the peculiarity of adjusting checks in FFD 1.05, the types of checks created will be automatically defined as "sell" and "sell_refund";
          If there is a receiptId in the request, the system will automatically find and generate a check, including the FP (fiscal characteristic) of the incorrect check in tag 1192, and, if necessary, the correctionInfo block;
          Always include correctionInfo in the request, except for correcting an existing check when working with FPD 1.05.
          
          There are 2 modes for creating correction checks:
          * to correct an error in an existing check (successfully registered in the cash desk service),
          * to create a correction check in cases when the fiscal check was not formed for some reason (cash desk settings, errors in the request format, mass failure, etc.)
          
          __Create a new__ correction check:
            1. In the doCorrection service, transfer a basket with the receiptType of the desired correction check, and a correctionInfo block.
            2. A correction check will be created based on the doCorrection request with the receiptType specified in it.
            3. If the receipt has a receiptId, but it fails, you do not need to pass the receiptId to fix it.
          
          __Fix successfully registered check__:
            1. In the doCorrection service, transfer the basket, receiptId of the corrected check, correctionInfo block. The unit does not need to be transferred to the FPD 1.05.
            2. Only a successful check is expected to receiveId. To correct an unregistered check, you do not need to transfer the receiptId to the doReceipt service.
            3. To cancel an incorrect check, a return check will be automatically generated with the inclusion of the PD of the incorrect check.
            4. The correction check will be created based on the receiptType passed to doCorrection.
      requestBody:
        description: Запрос создания чека коррекции
        x-description-i18n:
          eng: Query for correction receipt creation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/doCorrectionRequest'
            examples:
              newFFD105:
                summary: Новый чек коррекции ФФД 1.05
                x-summary-i18n: 
                  eng: New correction receipt FFD 1.05
                value:
                  userName: testUserName
                  password: testPassword
                  orderId: a67b0ced-c9a4-4cfb-bce3-b9595afaafc1
                  correctionInfo: {
                    type: "self",
                    baseDate: "29.07.2025",
                    baseNumber: "123"}
                  email: "customer@testmail.ru"
                  orderBundle: {
                    cartItems: {
                      items: [
                        {positionId: "1",
                        itemCode: "001",
                        name: "Услуга 1",
                        measurementUnit: шт,
                        quantity: {value: 2},
                        itemPrice: 500,
                        itemAmount: 1000,
