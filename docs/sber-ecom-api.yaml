              timezone | _FFD Tag 1011__. Number of the time zone of the place (address) of settlementsin accordance with the legislation of the Russian Federation. Number from 1 to 11.
              internet | _FFD Tag 1125__. An indication of the use of cash register when making a cashless payment on the Internet (true/false). The default value is true.
              
          type: array
