    externalRefundId:
      type: object
      properties:
        externalRefundId:
          description: |
            Ключ идемпотентности возврата, присвоенный Партнером. Учитывается в рамках одного заказа (orderId) и не имеет временных ограничений.
            При отправке повторного запроса с теми же данными и тем же ключом идемпотентности, ПШ обрабатывает запрос как повторный (с дублированием ответа на первоначальный запрос).
            Если в повторном запросе ключ идемпотентности тот же, а данные (хэш) запроса отличаются, то ПШ возвращает ошибку.
            При отправке запроса с уникальным ключом идемпотентности (либо при его отсутствии), ПШ обрабатывает запрос как новый.
          x-description-i18n:
            eng: |
              Refund idempotency key assigned by the Merchant. It is accounted within one order (orderId) with no time limits.
              When sending a requery with the same data and the same idempotency key, the PG processes the query as a requery (duplicating the response to the initial query).
              If the idempotency key in the requery is the same, and the query data (hash) are different, then PG returns an error.
              When sending a query with a unique idempotency key (or if not available), the PG processes the query as a new one.
          type: string
          maxLength: 36
          minLength: 1
          example: eccbf087-f159-4d69-b31d-00bec75c0474
          
    failUrl:
      description: |
        Адрес, на который требуется перенаправить Плательщика в случае неуспешной оплаты, когда Партнер использует платёжную страницу ПШ. Если не указан, используется returnUrl
        
        <span style="color:red;">__Обратите внимание!__</span>
        1. Если доменное имя содержит кирилические символы, то его необходимо преобразовать по алгоритму ACE. Т.е. строка "сберпей.рф" будет выглядеть как "xn--90aiaq2afe.xn--p1ai"
        2. Если query параметр содержит символ % - считается, что к данному параметру уже применено экранирование и преобразование не осуществляется (параметр остается "как есть")
        3. Если query параметр содержит символы, отличные от множества [a-zA-Z0-9.-*_ ], эти символы экранируются через символ %. Строка вида "сберпей.рф" будет выглядеть как "%D1%81%D0%B1%D0%B5%D1%80%D0%BF%D0%B5%D0%B9%2E%D1%80%D1%84"
      x-description-i18n:
        eng: |
          The address to which the Payer must be redirected in case of unsuccessful payment, when the Merchant uses the PG payment page. If not specified, returnUrl is used.
              
          <span style="color:red;">__Pay attention!__</span>
          1. If the domain name contains Cyrillic characters, then it must be converted using the ACE algorithm. I.e. the string "сберпей.рф" will look like "xn--90aiaq2afe.xn--p1ai"
          2. If the query parameter contains the % symbol, it is assumed that escaping has already been applied to this parameter and no conversion is performed (the parameter remains "as is")
          3. If the query parameter contains characters other than the set [a-zA-Z0-9.-*_ ], these characters are escaped through the % symbol. A string of the type "сберпей.рф" will look like "%D1%81%D0%B1%D0%B5%D1%80%D0%BF%D0%B5%D0%B9%2E%D1%80%D1%84"
      type: string
      maxLength: 2048
      minLength: 12
      pattern: ^(http://|https://).*$
      example: https://testmerchant.ru/fail

    features:
      description: |
        Дополнительные параметры управления сценариями при использовании платёжных реквизитов (можно указать несколько через разделитель ";"):
          * `VERIFY` = Происходит верификация Плательщика без списания средств с его счёта, поэтому в запросе можно передавать нулевую сумму. Даже если сумма платежа будет передана в запросе, она не будет списана со счёта покупателя. После успешной верификации заказ сразу переводится в статус REVERSED (отменён);
          * `AUTO_PAYMENT` = Платёж проводится с использованием ранее сохраненных реквизитов карты (связке) без проверки подлинности владельца карты (без CVC и 3-D Secure). Чтобы проводить подобные платежи у продавца должны быть соответствующие разрешения. __Функционал подключается по запросу__;
          * `FORCE_SSL` = Принудительное проведение платежа без использования 3-D Secure. Не может быть использован для сохранения данных карты (создания связки) __Функционал является высокорисковым, подключается по запросу__;
          * `FORCE_TDS` = Принудительное проведение платежа с использованием 3-D Secure. Если карта не поддерживает 3-D Secure, операция будет отклонена;
          * `FORCE_FULL_TDS` = Принудительное проведение платежа только с успешной аутентификацией плательщика 3-D Secure (Y). В противном случае операция будет отклонена.
      x-description-i18n:
        eng: |
          Additional parameters for scenario management when using payment details (you can specify several of them using the separator ";"):
            * `VERIFY` = The Payer is verified with no funds debited from his account, so the zero amount may be transferred in the query. Even if the payment amount is transferred in the query, it will not be debited from the buyer's account. After a successful verification, the order is immediately transferred to the REVERSED status (cancelled);
            * `AUTO_PAYMENT` = The payment by card binding is made without the cardholder authentication (without CVC and 3-D Secure). The seller must have appropriate authorizations to make such payments. __On-demand functionality__;
            * `FORCE_SSL` = Forced payment without using 3-D Secure. __On-demand hight-risk functionality__;
            * `FORCE_TDS` = Forced payment using 3-D Secure. If the card does not support 3-D Secure, the transaction will be rejected;
            * `FORCE_FULL_TDS` = Forced payment only with a successful payer authentication 3-D Secure (Y). Otherwise, the transaction will be rejected.
      type: string
      maxLength: 255
      minLength: 1
      pattern: ^[ -~]*$
      example: FORCE_TDS

    featuresP2P:
      description: |
        Тип перевода. Доступные значения:
          * `ORIGINAL_CREDIT` - выплата B2C (Перевод средств на карту/токен)
          
          Параметр обязателен для данного сервиса.
      x-description-i18n:
        eng: |
          Transfer type. Available values:
            * `ORIGINAL_CREDIT` - B2C payment (Money transfer to card/token)
            
          The parameter is required for this service
      type: string
      maxLength: 255
      minLength: 1
      pattern: ^[ -~]*$
      example: "ORIGINAL_CREDIT"


    featuresVerify:
      description: |
        Дополнительные параметры управления сценариями при использовании платёжных реквизитов:
          * `VERIFY` = Происходит верификация Плательщика без списания средств с его счёта, поэтому в запросе можно передавать нулевую сумму. Даже если сумма платежа будет передана в запросе, она не будет списана со счёта покупателя. После успешной верификации заказ сразу переводится в статус REVERSED (отменён);
      x-description-i18n:
        eng: |
          Additional parameters of scenario management when using payment details:
            * `VERIFY` = The Payer is verified with no funds debited from their account, so the zero amount can be transferred in the query. Even if the payment amount is transferred in the query, it will not be debited from the buyer's account. After the successful verification, the order is immediately transferred to the REVERSED status (cancelled);
      type: string
      maxLength: 255
      minLength: 1
      pattern: ^[ -~]*$
      example: VERIFY

