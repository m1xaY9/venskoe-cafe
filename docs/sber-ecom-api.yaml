                  * `1` - Попытки отправки чека исчерпаны, возможна повторная отправка через сервис retryReceipt.
                  * `2` - Повторная отправка возможна только после корректировки чека. Используйте сервис doReceipt.
                  * `3` - Повторная отправка в существующем формате возможна только после устранения проблемы в работе ККТ. После устранения проблемы используйте сервисы retryReceipt или doReceipt.
                  * `4` - Возникла ошибка. Обратитесь в поддержку Банка.
                x-description-i18n:
                  eng: |
                    Recommendation:
                    * `1` - Receipt sending attempts have been exhausted, resending using the retryReceipt service is possible.
                    * `2` - Resending is possible only after the receipt has been corrected. Use the doReceipt service.
                    * `3` - Resending in the existing format is possible only after the problem with the cash register has been resolved. Once the problem is fixed, use the retryReceipt or doReceipt services.
                    * `4` - An error has occurred. Please, contact support
