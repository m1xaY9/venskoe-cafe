      # General Information
      
      ## Terms
      * __Payment Gateway (PG, Gateway)__ is a number of solutions for the Internet acquiring process using various payment means.
      * __Merchant__ is the system or the person interacting with PG.
      * __Payer__ is the individual or the legal entity that makes a payment with his/her card for the merchant’s services in PG.
      * __Order__ is the elementary entity of PG describing the order in a certain online store or its analog.
      * __One-stage payment__ is the transaction of payment for goods/services that does not require additional confirmation (Completion), i.e. the funds are blocked and debited in one stage. This type of payment is preferred if the goods or services are provided immediately after the payment.
      * __Two-stage payment__ is the transaction of payment for goods/services that requires an additional confirmation (Completion), i.e. the payment is made in two stages. At the first stage, the payer's funds are checked and blocked (pre-authorization); then, at the second stage, the company either confirms that the funds should be debited or cancels the blocking of funds. The amount to be debited may be lower than the blocking amount.
      * __Holding (Blocking of funds)__ - The status of the amount of funds intended for compensation under the conducted transaction, from the time of successful authorization to the completion of settlements between the participating banks. At this stage, the funds are still on the Payer’s account, but are no longer available for use on the card.
      * __Refund__ means a partial or full refund of the Payer’s funds in case of their refusal to receive goods/services or the return of these. Refund is an offline transaction carried out after the funds are debited from the Payer. The reimbursement deadlines generally depend on the issuing bank and may be up to 30 days.
      * __Payment transaction cancellation (Reversal)__ is the operation of withdrawal (cancellation) of the Payer's funds withholding. Cancellation is an online operation, i.e. the card issuer receives an immediate request to unblock the amount. The cancellation may be carried out before the beginning of mutual settlements between the participating banks, therefore it is available for a limited time.
      * __Binding__ is the correspondence between the Payer and the card payment details (card or token number and validity period).
      * __3-D Secure (3DS)__ is the protocol of additional Payer authentication based on the concept of three domains: acquirer, issuer and compatibility.
      * __Access Control Server (ACS)__ is the element of 3-D Secure infrastructure that ensures the Payer authentication on the issuing bank's side. 
      * __MPI, 3DS Server__ is the element of 3-D Secure infrastructure on the acquiring bank's or Merchant's side.
      * __Fiscalization__ (__54-FZ__) is the procedure for generating a fiscal receipt for a successfully paid Order. This concept includes both the generation of a receipt for successful payment and the generation of a refund receipt, a closing receipt, etc.
      * __FDF__ - Fiscal Document Format. Standard of the Federal Tax Service, according to which all fiscal receipts are generated.
      * __Electronic Certificate (EC)__ is a record in the State Information System of Electronic Certificates (GIS ES). The EC holder gets access to this record using a national payment instrument, that is a PS Mir card.
      * __GWS__ — Goods/work/service
      * __NPCS__ - National Payment Card System
      * __FEC__ - Front Office of NPCS Electronic Certificates is the solution for a trade and service enterprise making it possible to purchase certain types of goods, work, services using EC tools
      
      ## Message processing 
      * Connection coordinates. Information about the coordinates for connecting to the test environment is also available in a special section for each service (on the right of the page).
      
      <span style="color:red;">__Attention!__</span> For correct interaction with the gateway, you need to [install the NCC certificate of the Digital Ministry](https://www.sberbank.com/ru/certificates).
      
      <span style="color:red;">__Attention!__</span> Provisional windows are provided in the test environment: on the weekdays, the time intervals are reserved for 02:00 - 06:00, 09:00 - 10:00 and 18:00 - 20:00 (Moscow time), during which maintenance work can be done to implement the functionality in the test facility.The stability of the environment performance at this time is not guaranteed.
      
      Test environment: https://ecomtest.sberbank.ru/...
      
      Production environment: https://epay.sberbank.ru/...
      * The payment gateway represents HTTP REST services by the POST method, with the transmission in "Content-Type: application/json" headers and a character set in the UTF-8 encoding. Messages are transmitted in JSON format (RFC 7159);
      * The names of objects in the services are passed as case-sensitive;
      * TLS protocols 1.2 and 1.3 are used for interaction;
      * After the Merchant’s registration, the login and password to be used for connection to PG are provided;
      * For the interaction with PG services, it is required to [install the NCC certificate of the Digital Ministry](https://www.sberbank.com/ru/certificates).
      
       <span style="color:red;">__Attention!__</span> It's not allowed to assign the value "null" to the parameters! If the parameter is "null", it should be completely excluded from the query.
          
