  /ecomm/gw/partner/api/ofd/v1/doReceipt:
    post:
      tags:
        - fiscalizationServices
      summary: Создание чека [doReceipt]
      x-summary-i18n:
        eng: Receipt creation [doReceipt]
      operationId: doReceipt
      description: |
        Сервис позволяет сформировать новый чек или изменить корзину в неуспешном чеке с использованием новой Корзины для повторной переотправки. 
                
        __Создание нового чека__
        
        Сервис `doReceipt` используется для создания чека полного расчета, чека возврата предоплаты или аванса на холдирование отдельно от финансовой операции. Если ранее был создан чек на Предоплату или Аванс, рекомендуется перед формированием чека полного расчета убедиться в успешном создании чека Предоплаты через `getReceiptStatus`. Дополнительно возможно использование сервиса в случаях, если фискализация не была настроена в системах Банка или партнера, в связи с чем попыток создания чека не осуществлялось.
        Для создания чека необходимо передать контакт Покупателя __email/phone__ и Корзину __orderBundle__. Если ранее был создан чек на Предоплату или Аванс, рекомендуется перед формированием чека полного расчета убедиться в успешном создании чека Предоплаты через `getReceiptStatus`.
        
        __Переотправка неуспешного чека с новой Корзиной__
        
        В некоторых случаях кассовый сервис не может зарегистрировать чек из-за некорректных данных в Корзине, ошибок в работе ККТ или по иным причинам.
        Сервис запроса статуса `getReceiptStatus` сообщит об этом в блоке error, предоставив код и описание ошибки. Поле __recommendation__ позволяет определить, есть ли необходимость в корректировке корзины и повторной отправке чека.
        Для попытки переотправки чека с новой корзиной необходимо:
        * Запросить статус чека через `getReceiptStatus`;
        * Получить статус Ошибка обработки чека (receiptStatus=4) или Попытки отправки чека исчерпаны (receiptStatus=5) со значением recommendation 2 или 3;
        * Изучить текст ошибки, внести изменения в запрос;
        * Отправить запрос `doReceipt` с указанием __receiptid__ исправляемого чека и контактами Покупателя __email/phone__.
        
        Указание receiptId для исправления чека рекомендуется в целях корректного отражения чеков в СберБизнес.
      x-description-i18n:
        eng: |
          The service generates a new receipt or change the Cart in an unsuccessful receipt using a new Cart for resending. 
          The service will create a new receipt only if there was a successful receipt within the order or an error occurred at the time of receipt generation. If the receipt creation was not initiated, it is not possible to create the receipt.
          
          __Creating a new receipt__
          
          The `doReceipt` service is used to create a full settlement receipt, a refund receipt for prepayment or advance holding payment separately from the financial transaction.
          To create a receipt, it is necessary to submit the Buyer's contact __email/phone__ and the Cart__orderBundle__. If a receipt for Prepayment or Advance Payment was created earlier, it is recommended to ensure that the Prepayment receipt was successfully created through `getReceiptStatus` before generating a full settlement receipt.
          
          __Resending unsuccessful receipt with new Cart__
          
          In some cases, the cash service cannot register the receipt due to incorrect data in the Cart, errors in the operation of the cash register or for other reasons.
          The `getReceiptStatus` status request service will report this in the error block, providing the error code and description. The __recommendation__ field indicates whether it is necessary to adjust the cart and resend the receipt.
          To try to resend the receipt with a new cart, it is necessary to:
          * Request the receipt status through `getReceiptStatus`;
          * Get the Receipt Proccessing Error status (receiptStatus=4) or Receipt Sending Attempts are Over (receiptStatus=5) with the value of recommendation 2 or 3;
          * Read the error text and make changes to the query;
          * Send the `doReceipt` query specifying the __receiptid__ of the receipt to be corrected and the Buyer's contacts __email/phone__.
      requestBody:
