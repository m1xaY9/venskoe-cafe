    description: |
      Методы API для создания, получения информации, активации, деактивации, проведения платежей по связкам.
      
      <span style="color:red;">__Внимание!__</span> Для некоторых категорий мерчантов (MCC) рекуррентные платежи по картам МИР недоступны.
      
      Расширенный сценарий применим только к связкам для карт Сбера.
      Расширение сценария осуществляется на шаге оплаты связкой. При попытке провести оплату по связке с недостаточным балансом или заблокированной картой, в ответе будет содержаться errorCode "0", error: "Запрос принят в обработку", info: "Запрос принят в обработку", эти коды и описания являются основным сигналом о том, что оплата не прошла успешно и сценарий идет по расширенной логике. При запросе getOrderStatusExtended actionCode сменится на 0, actionCodeDescription "Запрос принят в обработку" (новый статус). Этот статус у заказа будет сохраняться до оплаты заказа плательщиком или до истечения срока его жизни.
    
      Обратите внимание:
    
      1. Логика обработки features в запросах register/registerPreAuth теперь единая как для карточных bindingId, так и для bindingId SberPay, в случае если требуется использовать принудительное подтверждение операции разовым кодом передаются атрибуты FORCE_TDS/FORCE_FULL_TDS, а для случаев когда подтверждение не требуется AUTO_PAYMENT/FORCE_SSL.
      2. При реализации опыта через SDK SberPay (когда плательщик в момент оплаты находится на витрине) в запросе register также требуется передача [bindingId](https://ecomtest.sberbank.ru/doc#tag/basicServices/operation/register)
      3. Исключить регистрацию заказов со сроком действия менее 5 минут, так как при расширенной логике попытки регистрации заказа не пройдут валидацию на платежном шлюзе и отобьются ошибкой.
      4. Поддержать обработку нового error и info не предпринимать действий с заказом до его перехода в другой статус.    
      5. Должна быть реализована поддержка нотификаций по событиям со [связками](https://ecomtest.sberbank.ru/doc#tag/callbackServices/operation/bindingCallback) и [заказами](https://ecomtest.sberbank.ru/doc#tag/callbackServices/operation/callback).    
      6. Требуется учесть что в случае срабатываний расширенного опыта оплаты связкой возможно изменение карточных данных в существующей связке (если карта была заблокирована), кроме того возможна ситуация когда в getOrderStatusExtended вернется bindingId отличный от того с которым была инициирована оплата (случай недостатка средств)
