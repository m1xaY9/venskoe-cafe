  /ecomm/gw/partner/api/ofd/v1/retryReceipt:
    post:
      tags:
        - fiscalizationServices
      summary: Переотправка чека без изменения Корзины [retryReceipt]
      x-summary-i18n:
        eng: Resend the receipt with the Cart unchanged [retryReceipt]
      operationId: retryReceipt
      description: |
        Сервис позволяет сформировать повторный запрос на создание чека с Корзиной, идентичной первому чеку. Сервис используется только для переотправки неуспешных чеков. 
        Последовательность обработки запроса:
        * Запросить статус чека через `getReceiptStatus`.
        * Получить один из двух статусов, при котором возможна переотправка: Ошибка обработки чека (receiptStatus=4) или Ошибка отправки чека (исчерпаны попытки отправки) (receiptStatus=5).
        * Использовать `retryReceipt` с включением receiptId/externalId чека, который нужно переотправить. Возможна отправка массива receiptId/externalId, если необходимо переотправить несколько чеков. __Внимание!__ В случае, если в ответе на результат обработки чека отсутствует receiptId/externalId, использование сервиса retryReceipt невозможно. Обратитесь в техническую поддержку для получения рекомендаций.
        * На этапе получения статуса регистрации, при получении кода ошибки 1 с типом ошибки “timeout” происходит несколько автоматических попыток повторной регистрации чека. В связи с этим рекомендуется использовать сервис `retryReceipt` после исчерпания всех попыток регистрации, не ранее 15 часов после создания начального чека.
        * При использовании сервиса обратите внимание на сроки предоставления чека согласно 54-ФЗ.
      x-description-i18n:
        eng: |
          The service generates a repeated query to create a receipt with the Cart identical to the first receipt. The service is used only for resending unsuccessful receipts.
          Query processing sequence:
          * Request the receipt status through `getReceiptStatus`.
          * Get one of the two statuses that allow the resending: Receipt processing error (receiptStatus=4) or Receipt sending error (sending attempts are over) (receiptStatus=5).
          * Use `retryReceipt` including the receiptId/externalId of the receipt to be resent. The receiptId/externalId array can be sent if several receipts need to be resent. Attention! If the response to the receipt processing status does not contain a receiptId/externalId, the retryReceipt service may not be used. Contact the technical support for recommendations.
          * At the stage of obtaining the registration status, if error code 1 with the error type “timeout” is received, several automatic attempts will be made to re-register the receipt. In this case it is recommended to use the `retryReceipt` service after all registration attempts have been used, not earlier than 15 hours after the initial receipt has been created.
          * When using the service, please pay attention to the deadline for providing a receipt in accordance with 54-FZ.
      requestBody:
