  /ecomm/gw/partner/api/v1/getFiscalStatus:
    post:
      tags:
        - fiscalizationServices
      summary: Мониторинг состояния ККТ АТОЛ Онлайн [getFiscalStatus]
      x-summary-i18n:
        eng: Monitoring the status of the ATOL Online cash desk [getFiscalStatus]
      operationId: getLoyaltyBalance
      description: |
        Сервис для получения информации о состоянии ККТ и ФН. Позволяет с минимальной задержкой получать актуальную информацию о наполненности и дате замены ФН, наличии связи ККТ с ОФД и т.д.
          * Сервис поддержан только для касс АТОЛ Онлайн;
          * Сервис позволяет получить техническую информацию о текущем состоянии каждой кассы в группе касс. Максимум отражаемых касс - 100;
          * Запрос должен содержать или merchantId, или userName и merchantLogin. По умолчанию userName и merchantLogin совпадают;
          * Рекомендуемая частота запросов – 1 раз в 15 минут. Задержка в обновлении информации на стороне кассового сервиса, как правило, составляет не более 60 минут
      x-description-i18n:
        eng: |
          Monitoring the status of the ATOL Online cash desk. Allows to receive up-to-date information on PV filling and replacement date, availability of CCP connection with CRF, etc. with minimum delay.
            * The service is supported only for ATOL Online ticket offices;
            * The service allows you to get technical information about the current state of each cash desk in the cash desk group. Maximum reflected cash registers - 100;
            * The query must contain either merchantId or userName and merchantLogin. By default, userName and merchantLogin are the same;
            * The recommended request rate is 1 every 15 minutes. The delay in updating information on the cash desk side, as a rule, is no more than 60 minutes
      requestBody:
