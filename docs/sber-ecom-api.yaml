  /ecomm/gw/partner/api/v1/finish3dsMethod.do:
    post:
      tags:
        - additionalThreeDSServices
      summary: Завершение 3DS Method [finish3dsMethod]
      x-summary-i18n:
        eng: Finish 3DS Method [finish3dsMethod]
      operationId: finish3dsMethod
      description: |
        Запрос предназначен для завершения 3DS аутентификации Плательщика при проведении операции оплаты.
        Последовательность обработки запроса:
        * создать заказ через сервисы `register` или `registerPreAuth`, в зависимости от сценария платежа;
        * провести оплату через сервисы, указанные в `paymentOrder` или `paymentOrderBinding` с получением в ответе требований проведения 3DS Method (threeDSMethodURL). Значение threeDSMethodData возвращается, если в запросе был передан threeDSMethodNotificationUrl, в противном случае Партнер самостоятельно формирует объект threeDSMethodData= base64url({"threeDSServerTransID":"value","threeDSMethodNotificationURL":"value"});
        * визуализировать скрытый iframe в браузере Плательщика с отправкой HTML формы с threeDSMethodData через HTTP POST на threeDSMethodURL;
        * получить обратный вызов на threeDSMethodNotificationURL по результату обработки запроса 3DS Method с получением threeDSMethodData = base64url({"threeDSServerTransID":"value"} в течение таймаута 10 секунд;
        * вызвать сервис завершения 3DS аутентификации `finish3dsMethod`.
      x-description-i18n:
        eng: |
          The query is intended to complete the Payer's 3DS authentication during the payment transaction.
          Query processing sequence:
          * create an order through `register` or `registerPreAuth` services, depending on the payment scenario;
          * make the payment through the services specified in `paymentOrder` or `paymentOrderBinding` and obtain the requirements for 3DS Method (threeDSMethodURL) in the response. The value threeDSMethodData is returned if threeDSMethodNotificationUrl was sent in the query, otherwise the Merchant generates the object threeDSMethodData= base64url({"threeDSServerTransID":"value","threeDSMethodNotificationURL":"value"}) independently;
          * visualize the hidden iframe in the Payer’s browser and send an HTML form with threeDSMethodData via HTTP POST to threeDSMethodURL;
          * receive a callback to threeDSMethodNotificationURL upon the processing of the 3DS Method query and receive threeDSMethodData = base64url({"threeDSServerTransID":"value"} within a 10-second timeout;
          * call the `finish3dsMethod` 3DS authentication completion service.
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        description: Запрос завершения 3DS Method
        x-description-i18n:
          eng: Query for finishing the 3DS Method
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/finish3dsMethodRequest'
        required: true
