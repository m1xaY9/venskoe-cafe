  description: |
    [Switch to English](/en/doc)
    
    Настоящий документ описывает программные интерфейсы платёжного шлюза Сбербанка, который позволяет проводить платежи в интернет-эквайринге.

    По вопросам работы с API необходимо обращаться в Службу Поддержки (email: <a href="mailto:Support_ecomm@sberbank.ru">Support_ecomm@sberbank.ru</a>). При обращении желательно указывать, что вопрос по целевому шлюзу интернет-эквайринга.
    
    По вопросам получения доступов, операционной деятельности и прочим вопросам обслуживания необходимо обращаться к вашему менеджеру.
    
