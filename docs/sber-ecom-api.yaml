  /ecomm/gw/partner/api/v1/reverse.do:
    post:
      tags:
        - basicServices
      summary: Отмена заказа [reverse]
      x-summary-i18n:
        eng: Order cancellation [reverse]
      operationId: reverse
      description: |
        Запрос предназначен для снятия блокировки средств по операции оплаты. Может быть осуществлена до момента начала взаиморасчетов банков-участников. При оплате Одностадийного платежа может быть выполнена в течение банковского дня совершения операции (~ до 23:59 МСК). При оплате по Двухстадийному сценарию может быть выполнена только до операции завершения двухстадийного сценария. 
        
        Может быть выполнен как на полную сумму операции, так и на ее часть. Для отмены на полную сумму в параметре amount передается вся сумма авторизации или значение "0".
      x-description-i18n:
        eng: The query is intended to unblock the funds for the payment transaction. It can be done before the beginning of mutual settlements between the participating banks. With a one-stage payment, it can be completed during the banking day of the transaction (~ until 23:59 Moscow time). With a two-stage scenario, it can only be performed before the operation of completion of the two-stage scenario.
