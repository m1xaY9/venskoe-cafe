    dataEntryModeAttributes:
      description: Атрибуты режима ввода карточных данных
      x-description-i18n:
        eng: Attributes of the card data entry mode
      type: object
      properties:
        dataEntryMode:
          description: |
            Режим ввода платёжных данных в операции. В случае отсутствия воспринимается, как операция, инициированная Плательщиком без сохранения реквизитов. 
              * `CAPTURED` = Операция инициирована Плательщиком; реквизиты сохраняются для последующих операций;
              * `CREDENTIAL-ON-FILE` = Операция инициирована Плательщиком с использованием ранее сохраненных реквизитов;
              * `RECURRING` = Операция инициирована Партнером с использованием сохраненных реквизитов; периодический платёж по поручению Плательщика без графика; <span style="color:red;">Внимание! Не может использоваться для двухстадийной оплаты (registerPreAuth)</span>
 ##             * `DEFERRED` = Операция инициирована Плательщиком; реквизиты сохраняются для последующих операций, отложенная авторизация;
 ##             * `INSTALLMENT` = Операция инициирована Партнером с использованием сохраненных реквизитов; периодический платёж по поручению Плательщика по графику;
 ##             * `RESUBMISSION` = Операция инициирована Партнером с использованием сохраненных реквизитов; повторная авторизация.
          x-description-i18n:
            eng: |
              Transaction payment data entry mode. If none, it is perceived as a transaction initiated by the Payer without storing the details.
                * `CAPTURED` = the transaction is initiated by the Payer; the details are stored for subsequent transactions;
                * `CREDENTIAL-ON-FILE` = The transaction is initiated by the Payer using previously stored details;
                * `RECURRING` = The transaction is initiated by the Merchant using stored details; periodic payment on behalf of the Payer without a schedule; <span style="color:red;">Attention! Cannot be used for two-stage payment (registerPreAuth)</span>.
##                * `INSTALLMENT` = The transaction is initiated by the Merchant using stored details; periodic payment on behalf of the Payer according to the schedule;
##                * `DEFERED` = The transaction is initiated by the Payer; the details are stored for subsequent transactions, deferred authorization;
##                * `RESUBMISSION` = The transaction is initiated by the Merchant using stored details; re-authorization.
          type: string
          maxLength: 20
          minLength: 1
          pattern: ^[ -~]+$
          enum:
            - CAPTURED
            - CREDENTIAL-ON-FILE
            - RECURRING
##            - DEFERRED
##            - INSTALLMENT
##            - RESUBMISSION
          example: CAPTURED
        initialOrderId:
          $ref: '#/components/schemas/initialOrderId'
      additionalProperties: false

