            * Отсутствует информация от НСПК, получаемая любым путем
          x-description-i18n:
            eng: |
              Registered Payment or Information Link of the current version FPS of the 2D QR code format (ISO/IEC 18004-2015), presented as URLBased.
              
              Not returned if:
