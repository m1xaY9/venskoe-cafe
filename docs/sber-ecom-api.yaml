      # Payment with SberPay
      When interacting with the Payment Gateway, the Merchant has access to payment functions with SberPay in the mobile Sberbank Online app. 
      The implementation of the functionality to achieve the best possible conversion rates provides for the compliance of the Merchant's payment experience with the Bank's requirements, 
      the functionality description and the examples of implementation are available in [briefing materials](promo/sponline.pdf).
      
      ## APP channel payments
      SberPay supports the APP channel payment feature set. Two implementations of the payment feature set are used:
      - SberPay SDK InApp
      - SberPay App2App 
      
      ### SberPay SDK InApp      
      This SDK is a software development kit that enables easy integration of SberPay into a partner’s mobile app and enhance user experience.
      <a href='img/SPSDK_innApp_flow.png' target='_blank'><img src='img/SPSDK_innApp_flow.png'></a>
      
      SDK InApp benefits include:
      •	No need to make any modifications to the implemented method. The Bank is responsible for any InApp SDK surface modifications and support
      •	Better conversion into payments. All Sber cards are available on the SDK InApp surface, while balances and additional Sber financial services are also displayed
      •	Advanced customer experience. The shortest possible customer journey. Long-term cookie-driven authentication support. Customers are not led away from a partner’s surface. A high-quality payment surface UX/UI
      •	InApp SDK operating stability is not vulnerable to sanctions.
      
      Developer materials available by the [link](https://developers.sber.ru/docs/ru/sberpay-sdk/overview)
      
      ### SberPay App2App 
      This legacy SberPay feature set enables integration of SberPay into a partner’s app. Payments are to be confirmed and completed in the Sber app via a deeplink embedded in the SberPay payment button.
      
      ## WEB channel payment
      SberPay supports its own payment feature set on desktop and mobile WEB sites.
      
      ### SberPay WEB SDK
      WEB SDK enables integration of the native SberPay payment surface into a partner’s website. This technology solution offers the best SberPay customer experience and has the following benefits:
      
      <a href='img/websdk_flow.png' target='_blank'><img src='img/websdk_flow.png'></a>
      
      •	Straightforward implementation. The Bank will provide a ready-made library that the partner only needs to embed into their web site
      •	Customers are not led away from a web site. From the customer’s prospective, a payment is completed right on the website without any redirections. A convenient payment curtain allows customers to see all of their cards and balances at once, and supports Sber’s financial services
      •	No support costs. The Bank updates and maintains the customer experience on the payment surface
      •	A single sign-in is sufficient. Once a customer has authenticated on the payment surface, we will remember them. All subsequent payments will be made seamlessly.
      
      Developer materials available by the [link](https://developers.sber.ru/docs/ru/sberpay-sdk/overview)
      
      ### SberPay Web2App (native integration)
      This is an alternative native payment experience on a WEB surface without using a payment page. 
      The payment feature set is implemented under two scenarios:
      •	A partner displays a QR code on their website’s surface. The customer must scan it to make a payment. The payment will be confirmed and completed within Sberbank’s app.
      •	A partner displays a “Pay by phone number” button. To pay, the customer will enter their Sberbank app-linked phone number. After that, they will be sent a push notification or an SMS. The push notification or a link in the SMS will open the Sberbank app where the client will confirm and complete the payment.
      <span style="color:red;">IMPORTANT!</span> This payment feature set requires a particularly thorough compliance with the Bank’s UX/UI guidelines.
      
      ### Payment page
      SberBank’s payment page is installed by default when Sber’s acquiring service is enabled. The partner has the ability to enable payments via SberPay on the payment page surface.
      It’s an easy and convenient way to shop online. A customer just needs to press the SberPay payment button and scan the QR code (or select payment by the phone number). Payments are completed within the Sberbank app, where customers can select any available card.
      You won’t need to make any modifications if you have SberBank’s acquiring service enabled.
      
      You can file an application to join SberPay at our [site](http://www.sberbank.ru/ru/s_m_business/bankingservice/sberpay)
      
      ## Additional matherials on service integration
      __Please note!__ Work with the SberPay payment functionality is available as part of the services described in the documentation, but can be 
      integrated by the Merchant separately from other payment methods. When working with the SberPay functionality, the utilisation of the sberbankOnlineAttributes block in the query body 
      in jsonParams is __mandatory__ when registering an order in the register/registerPreAuth services.
      
      <a href='img/eng_sequence_sberpay.png' target='_blank'><img src='img/eng_sequence_sberpay.png'></a>
      
      When integrating the mweb2app scenario on apple devices, it is necessary to implement a deeplink lookup procedure. This is related to different app versions installed on users' devices. Detailed instructions for the procedure implementation are available in [document](promo/eng_deeplink_select_mWeb2app.pdf).
      
      For additional details on the SberPay testing procedure, please see [documentation](promo/eng_sberpay_tfaq.pdf).
      
      The description of the requirements to Merchant experience when implementing the SberPay functionality is in the attached [document](promo/Sberpay_experience.pdf).
      
      The description of the integration of the SberPay functionality is in the attached [document](promo/Sberpay_integration.pdf).
      
      The logos guide for SberbankOnline is in the attached [document](promo/Sberpay_logo.pdf).
      
      The transaction processing and the Gateway responses correspond to the description placed in the sections [Description of Gateway response codes] doc#section/Obshaya-informaciya/Opisanie-kodov-otveta-Shlyusa) 
      and [Description of Gateway error codes](doc#section/Obshaya-informaciya/Opisanie-kodov-oshibok-Shlyusa).
      
      The example of payment with SberPay SDK can be found at [link](https://rutube.ru/video/private/870dc0daa27c0808dfb5fc595f85387b/?p=G9FAeSseAPEUiyJ4B0fzLw).
      
      The instructions for SberPay SDK implementation for websites and mobile applications are available at [link](https://developers.sber.ru/docs/ru/sberpay-sdk/overview).
      
      You can see how to draw a button SberPay [here](promo/SberPay_Button_Example.rar).
      
      Acceptable options for rendering the logo of SberPay is in the attached [document](promo/Logo_rules.zip)      
      
      
      # Fiscalization (54-FZ)
      
      In accordance with Federal Law of the Russian Federation No. 54-FZ dated July 1, 2017, when conducting online sales, the Seller (in this documentation - the Merchant), using an online cash register, is obliged to generate a cash receipt and send it to the Federal Tax Service and the buyer. In order to meet this requirement, Sberbank developed the mechanism for integration with online cash registers, which enables to simplify this procedure for the Merchant. At present, the Payment Gateway supports only ATOL Online, EVOTOR Digital Cash Desks, Business.ru with FDF versions 1.05 and 1.2 and OFD.RU with FDF version 1.1 and 1.2
      
      ## Available functionality
      
      - Sending data to an online cash register to generate receipts in FDF formats 1.05 and 1.2;
      - Generation of receipts and refunds of receipts (including partial); 
      - Possibility to resend an unsuccessful receipt with changing the cart;
      - Resending the receipt in case of a cash register error or at the sending timeout;
      - Creating a receipt separately from the financial transaction (closing receipt);
      - Possibility to divide the receipt into several, if the maximum size is exceeded;
      - Getting the receipt status with a separate API query.
      
      ## Receipt generation conditions
      For a cash receipt to be registered successfully, the following conditions must be met:
        - To create a receipt it is necessary to transfer the cart with the mandatory presence of ffdVersion and receiptType parameters in any of the register, registerPreAuth, deposit, reverse, refund services;
        - Each receipt will have the parameters that were transferred as part of the relevant service;
        - The order fiscalization functionality is connected and successfully configured for the merchant: the credentials for connecting the online cash register are correct and entered in settings. 
      
      ## Permissive regime for the sale of labeled goods
      Starting from 04/01/2025, before selling market goods, it is necessary to online check the marking code in an Honest Sign.
      There are 2 ways to perform verification:
        1. On the side of your cash register service, you must enable marking code verification and specify the pre-receive Honest Sign Token. The check will be performed automatically by the cash register service, and the data will be transmitted into the Honest Sign. In this case, you cannot transfer sectoralItemProps (tag 1260) and all nested objects as part of the bucket. Please note that only Business cash register services support this method.Ru and Farms from OFD.RU .
        2. Self-integration with a Honest Sign to obtain data on the status of the marking code, and the inclusion of this data in the sectoralItemProps object (tag 1260) when forming a "closing" receipt.
        
      1260 tag composition:
      | Tag | Name | Value |
      |-----|------|-------|
      | 1262| FOIV identificator | Fixed: 030 |
      | 1263| Date of the substantiating document | Fixed: 21.11.2023 |
      | 1264| Number of the substantiating document | Fixed: 1944 |
      | 1265| The value of industry props | Dynamic field. In the response of the marking code in an Honest Sign online verification method, the attributes are returned: __reqId__ (Request identificator) and __reqTimestamp__ (Requet time). Attributest must be passed to the 1265 tag in the format: _UUID=reqId&Time=reqTimestamp_ |
             
      ## Connection of the cash register
      To connect the Evotor cash register, it is necessary to:
      1. Log in the [Digital cash register](https://digital.evotor.ru/login) service to receive a cloud cash register or install the Digital cash register app [from the Evotor store](https://market.evotor.ru/store/apps/2778de62-57ee-4324-8f17-d89f17c91872) of your online cash register.
      2. On your own, in accordance with [instructions](https://docs.evotor.online/) or with the help of Evotor employees, register the cash register with the Federal Tax Service (FTS) and the Fiscal Data Operator (FDO).
      3. In your [Digital cash register](https://digital.evotor.ru/login) personal account (if you use a cloud cash register) or in the Evotor personal account (if you use an online cash register), get the cash register credentials - Cash register group code.
      4. You can set up the integration through your personal account of [SberBusiness](https://www.sberbank.com/help/business/sbbol/100746) or by sending a query to the technical support service of Sberbank's Internet acquiring. The query should specify the Cash Register Group Code, the FDF version used and the merchantID provided by the Bank.
      
      To connect the ATOL cash register, it is necessary to:
      1. Log in the service ["ATOL Online"](https://sberbank.atol.ru/);
      2. On your own, in accordance with [instructions](https://atol.online/upload/iblock/83b/0s367ftz1ydlc8cf1v55vljqt3cr16t2/Atol_Pamyatka_PRIL_22.pdf) or with the help of ATOL Online employees, register the cash register with the Federal Tax Service (FTS) and the Fiscal Data Operator (FDO);
      3. Get the cash register credentials (login, password, cash register group code) in your ATOL Online personal account;
      4. You can set up the integration through your personal account of [SberBusiness](https://www.sberbank.com/help/business/sbbol/100746) or by sending a query to the technical support service of Sberbank's Internet acquiring. The query should specify the cash register credentials and the FDF version being used.
      
      To connect the OFD.RU cash register, it is necessary to:
      1. Log in the personal account of the [OFD.RU Merchant](https://lk.ofd.ru/);
      2. Register the cash register with the Federal Tax Service (FTS);
      3. Get the cash register credentials (login, password) in your OFD.RU Merchant personal account;
      4. You can set up the integration through your personal account of [SberBusiness](https://www.sberbank.com/help/business/sbbol/100746) or by sending a query to the technical support service of Sberbank's Internet acquiring. The query should specify the cash register credentials and the FDF version being used.
      
      To connect the Business.ru cash register, it is necessary to:
      1. Log in the personal account of the [Business.ru](https://check.business.ru/);
      2. Register the cash register with the Federal Tax Service (FTS);
      3. Contact with Business.ru support with a request to enable Sberbank api-integration;
      4. Get the cash register credentials (login, password) in your Business.ru Merchant personal account;
      5. You can set up the integration through your personal account of [SberBusiness](https://www.sberbank.com/help/business/sbbol/100746) or by sending a query to the technical support service of Sberbank's Internet acquiring. The query should specify the cash register credentials and the FDF version being used.
     
      
      
